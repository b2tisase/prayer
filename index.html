          { num: "፪", paragraphs: ["አቤቱ እናመስግንሃለን አቤቱ እናከብርሃለን አቤቱ እንገዛልሃለን። አቤቱ ቅዱስ ስምህን እናመስግናለን። ጉልበት ሁሉ የሚሰግድልህ አቤቱ እንሰግድልሃለን አንደበትም ሁሉ ላንተ ይገዛል የአምላኮች አምላክ የጌቶች ጌታ የንጉሦችም ንጉሥ አንተ ነህ። የሰጋም የነፍስም ፈጣሪ አነተ ነህ። እናንተስ በምትጸልዩበት ጊዜ እንዲህ ብላችሁ ጸልዩ ብሎ ቅዱስ ልጅህ እንዳስተማረን እንጠራለሃን።"] },
          { num: "፫", paragraphs: ["<strong class='rubric text-lg block mb-1'>አባታችን ሆይ</strong> አባታችን ሆይ በሰማያት የምትኖር ስምህ ይቀደስ መንግሥትህ ትምጣ ፈቃድህ በሰማይ እንደሆነች እንዲሁም በምድር ትሁን። የዕለት እንጀራችንን ስጠን ዛሬ በደላችንንም ይቅር በለን፤ እኛም የበደሉንን ይቅር እንደምንል። አቤቱ ወደ ፈተናም አታግባን ከክፉ ሁሉ አድነን እንጂ መንግሥት ያንተ ናትና ኃይል ክብር ምስጋናም ለዘለዓለሙ አሜን።"] },
          { num: "፬", paragraphs: ["<strong class='rubric text-lg block mb-1'>ሰላም ለኪ (የእመቤታችን ሰላምታ)</strong> እመቤቴ ቅድስት ድንግል ማርያም ሆይ፤ በመልአኩ በቅዱስ ገብርኤል ሰላምታ ሰላም እልሻለሁ በሃሳብሽ ድንግል ነሽ በሥጋሽም ድንግል ነሽ። የአሸናፊ የእግዚአብሔር እናት ሆይ፤ ላንቺ ሰላምታ ይገባል። ከሴቶች ሁሉ ተለይተሽ አንቺ የተባረክሽ ነሽና የማኅፀንሽም ፍሬ የተባረከ ነው። ፀጋን የተመላሽ ድንግል ሆይ ደስ ይበልሽ እግዚአብሔር ካንቺ ጋር ነውና ከተወደደው ልጅሽ ከጌታችን ከመድኃኒታችን ከኢየሱስ ክርስቶስ ዘንድ ይቅርታን ለምኝልን ኃጢአታችንን ያስተሰርይልን ዘንድ አሜን።"] },
          { num: "፭", paragraphs: [
            "<strong class='rubric text-lg block mb-1'>የሃይማኖት ጸሎት</strong> ሁሉን የፈጠረ አንድ አምላክ በሚሆን በእግዚአብሔር አብ እናምናለን። ሰማይንና ምድርን የፈጠረ የሚታየውንና የማይታየውን ዓለም ሳይፈጠር ከርሱ ጋር በነበረ አንድ የአብ ልጅ በሚሆን በአንድ ጌታ በኢየሱስ ክርስቶስ እናምናለን ፥ ከብርሃን የተገኘ ብርሃን ከእውነተኛ አምላክ የተገኘ እውነተኛ አምላክ የተወለደ እንጂ ያልተፈጠረ በባሕርዩ ከአብ ጋር የሚተካከል ሁሉ በእርሱ የሆነ በሰማይም ካለው በምድርም ካለው ያለርሱ ምንም ምን የሆነ የለም ስለኛ ስለሰዎች እኛን ለማዳን ከሰማይ ወረደ በመንፈስ ቅዱስ ግብር ከቅድስት ድንግል ማርያም ፍጹም ሰው ሆነ፣ ደግሞ ስለኛ ተሰቀለ በጴንጤናዊው በጲላጦስ ዘመን እርሱ መከራን ተቀበለ ሞተ ተቀበረ በሦስተኛውም ቀን ከሙታን ተለይቶ ተሰሣ፣ በቅዱሳን መጻሕፍት እንደተጻፈ በክብር በምስጋና ወደሰማይ ዐረገ።",
            "በአባቱም ቀኝ ተቀመጠ፣ ዳግመኛም በሕያዋንና በሙታን ለመፍረድ በምስጋና ይመጣል ለመንግሥቱም ፍጻሜ የለውም። በመንፈስ ቅዱስም እናምናለን እርሱም ጌታ ሕይወትን የሚሰጥ ከአብ የሠረፀ ከአብ ከወልድ ጋራ በአንድነት እንሰግድለታለን እናመሰግነዋለን እርሱም በነቢያት አድሮ የተናገረ ነው። ከሁሉም በላይ በምትሆን ሐዋርያት በሠሯት በአንዲት ክብርት ቤተ ክርስቲያን እናምናለን። ኃጢአት በሚሠረይባት በአንዲት ጥምቀትም እናምናለን የሙታንንም መነሣት ተስፋ እናደርጋለን የሚመጣውንም ሕይወት ለዘላለሙ።"
          ] },
          { num: "፮", paragraphs: ["አሸናፊ እግዚአብሔር ቅዱስ ቅዱስ ቅዱስ ተብለህ ትመሰገናለህ። ምስጋናህም በሰማይ በምድር የመላ ነው። ክርስቶስ ላንተ እንሰግድልሃለን ከሰማያዊ ከቸር አባትህ ጋራ አዳኝ ከሆነ ከመንፈስ ቅዱስ ጋራ እንሰግድልሃለን ወደዚህ ዓለም መጥተህ አድነኸናልና።"] },
          { num: "፯", paragraphs: [
            "<span class='rubric'>ለአብ ለወልድ ለመንፈስ ቅዱስ አንዲት ስግደት እሰግዳለው /3 ጊዜ በል/፡፡</span>",
            "አንድ ሲሆን ሦስት ሦስት ሲሆኑ አንድ በአካል ሦስት ሲሆኑ በመለኮት አንድ ለሚሆኑ እሰግዳለው አምላክን ለወለደች ለእመቤታችን ለድንግል ማርያም እሰግዳለው፣ ዓለምን ለማዳን ሲል ኢየሱስ ክርስቶስ ለተሰቀለበት መስቀልም እስገዳለሁ። መስቀል ኃይላችን ነው ኃይላችን መስቀል ነው የሚያፀናን መስቀል ነው፣ መስቀል ቤዛችን ነው፣ መስቀል የነፍሳችን መዳኛ ነው፣ አይሁድ ይክዱታል እኛ ግን እናምነዋለን ያመነውም እኛም በመስቀሉ እንድናለን፣ ድነናለም።"
          ] },
          { num: "፰", paragraphs: [
            "<span class='rubric'>ለአብ ምስጋና ይገባል፣ ለወልድም ምስጋና ይገባል፣ ለመንፈስ ቅዱስም ምስጋና ይገባል። /3 ጊዜ በል/</span>",
            "አምላክን ለወለደች ለእመቤታችን ለድንግል ማርያም ምስጋና ይገባል። ለኢየሱስ ክርስቶስ መስቀልም ምስጋና ይገባል። ክርስቶስ በቸርነቱ ያስበን ዘንድ፣ ዳግመኛም በመጣ ጊዜ እንዳያሳፍረን፣ ስሙን ለማመስገን ያነቃን ዘንድ፣ እርሱንም በማምለክ ያጸናን ዘንድ፣ እመቤታችን ጸሎታችንን አሳርጊልን፣ ኃጢአታችንንም አስተሥርዩልን በጌታችን መንበር ፊት ጸሎታችንን አሳርጊልን፣ ይህንን ኅብስት ላበላን ይህንንም ጽዋ ላጠጣን፣ ምግባችንንና ልብሳችንንም ላዘጋጀልን፣ ኃጢአታችንንም ሁሉ ለታገሠልን፣ ክቡር ደሙን ቅዱስ ሥጋውን ለሰጠን፣ እስከዚችም ሰዓት ላደረሰን ለእሱ ለልዑል እግዚአብሔር ፍፁም ምስጋና ይገባል፣ ለወለደችው ለድንግም ምስጋና ይገባል፣ ለክቡር መስቀሉም ምስጋና ይገባል። የእግዚአብሔር ስሙ ፈጽሞ ይመሰገን ዘንድ ዘወትር በየጊዜያቱና በየሰዓቱ ምስጋና ይገባል።"
          ] },
          { num: "፱", paragraphs: ["እናታችን ማርያም host ሰላም ላንቺ ይሁን እያልን እንሰግድልሻለን እንማልድሻለን ከአዳኝ አውሬ ታድኝን ዘንድ ተማጽነንብሻል ስለ እናትሽ ስለ ሐና ብለሽ ስለ አባትሽ ስለ ኢያቄም ብለሽ ድንግል ማኅበራችንን ዛሬ ባርኪልን።"] },
          { num: "፲", paragraphs: [
            "<strong class='rubric block mb-1'>አምላክን በድንግልና የወለደች የእመቤታችን የማርያም ጸሎት</strong>",
            "ማርያምም አለች ነፍሴ እግዚአብሔርን ታላቅ ታደርገዋለች መንፈሴም በመድኃኒቴ በእግዚአብሔር ደስ ይላታል። የባሪያይቱን መዋረድ አይቷልና። እነሆ ከዛሬ ጀምሮ ትውልድ ሁሉ ያመሰግኑኛል፡፡ እርሱ ብርቱ የሚሆን ታላቅ ሥራን ለእኔ አድርጓልና ስሙም ቅዱስ ነው። ለሚፈሩትም ምሕረቱ ለልጅ ልጅ ነው ኃይልን በክንዱ አደረገ። በልባቸው አሳብ የሚኮሩ ትዕቢተኞችን በታተናቸው ብርቱዎችንም ከዙፋናቸው አዋረዳቸው። የተራቡትንም በቸርነቱ አጠገባቸው ባለጠጎችንም ቦዶ እጃቸውን ሰደዳቸው ምሕረቱን እንዲያስብ እስራኤል ባርያውን ተቀበለ። ለአባቶቻችን ለአብርሃምና ለዘሩም እስከዘለዓለሙ ድረስ እንደተናገረው።"
          ] }
        ]
      },
      weekly: {
        mon: {
          name: "ሰኞ",
          title: "ሶርያዊው ቅዱስ ኤፍሬም የደረሰው ሰኞ የሚጸለይ አምላክን የወለደች የድንግል ማርያም ምስጋና፤ የመጀመሪያ ክፍል።",
          verses: [
            "፩፤ ጌታ ልቡ ያዘነና የተከዘ አዳምን ነፃ ያወጣውና ወደ ቀድሞ ቦታው ይመልሰው ዘንድ ወደደ። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፪፤ ከድንግል ያለወንድ ዘር በሥጋ ተወለደና አዳነን።",
            "፫፤ ከይሲ (ዲያብሎስ) ያሳታት ሔዋንን እግዚአብሔር ምጥሽንና ጻርሽን አበዛዋለሁ ብሎ ፈረደባት፤ ሰውን ወደደና ነፃ አደረጋት። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፬፤ ሰው የሆነና በኛ ያደረ ቃል ኢየሱስ ክርስቶስ ነው። ክብሩንም ለአባቱ አንደ እንደመሆኑ ክብር አየን። ይቅር ይለን ዘንድ ወደደ። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፭፤ ነቢዩ ኢሳያስ በመንፈስ ቅዱስ የአማኑኤልን ምሥጢር አየ ስለዚህም ሕፃን ተወለደልን ወልድም ተሰጠን ብሎ አሰምቶ ተናገረ። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፮፤ ሰው ሆይ ፈጽመህ ደስ ይበልህ እግዚአብሔር ዓለሙን ወዶታልና አንድ ልጁንም የሚያምንበት ሁሉ እስከ ዘለዓለም ፈጽሞ ይድን ዘንድ አሳልፎ ሰጥቷልና ልዑል ክንዱን ሰደደልን። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፯፤ የነበረው የሚኖረው የመጣው ዳግመኛ የሚመጣውም ቃል ኢየሱስ ክርስቶስ ያለመለወጥ ፍጹም ሰው ሆነ። አንዱ ወልድ በሥራው ሁሉ አልተለየም የእግዚአብሔር ቃል መለኮት አንድ ነው እንጂ ። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፰፤ የነቢያት ሀገራቸው ቤተልሔም ሆይ ደስ ይበልሽ ሁለተኛው አዳም ክርስቶስ በአንቺ ዘንድ ተወልዷልና። የቀድሞውን ሰው አዳምን ከምድር (ከሲኦል) ወደ ገነት ይመልሰው ዘንድ፤ አዳም ሆይ መሬት ነበርክና ወደ መሬት ትመለሳለህ ብሎ የፈረደበትንም የሞት ፍርድ ያጠፋለት ዘንድ፤ ብዙ ኃጢአት ባለችበት የእዚአብሔር ጸጋ ትበዛለች። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፱፤ የሰው ሁሉ ሰውነት ደስ ይላታል በሰማይ ለእግዚአብሔር ምስጋና ይሁን በምድርም ሰላም ለሰውም እርሱ በሚፈቅደው እያሉ አሰምተው ንጉሥ ክስርቶስን ከመላእክት ጋር ያመስግኑታል። የቀድሞውን እርግማን አጥፍቷልና የጠላትን ምክሩን አፈረሰበት ለአዳምና ለሔዋን የዕዳ ደብዳቤያቸውን ቀደደላቸው በዳዊት ሀገር የተወለደ መድኃኒታችን ኢየሱስ ክርስቶስ አዳምንና ሔዋንን ነፃ አደረጋቸው። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፲፤ በዚህ ዓለም ለሚኖሩ ሰዎች ሁሉ የምታበራ እውነትኛ ብርሃን ስለሰው ፍቅር ወደ ዓለም የመጣህ ፍጥረት ሁሉ በመምጣትህ ደስ አለው አዳምን ከስህተት አድነኸዋልና ሔዋንንም ከሞት ጻዕረኝነት ነፃ አድርገኻታልና የምንወለድበትን መንፈስ (ረቂቁን ልደት) ሰጠኸን ከመላእክት ጋርም አመስገንህ። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>"
          ]
        },
        tue: {
          name: "ማክሰኞ",
          title: "ማክሰኞ የሚጸለይ አምላክን የወለደች የእመቤታችን የድንግል ማርያም ምስጋና፤ ሁለተኛ ክፍል።",
          verses: [
            "፩፤ የመመኪያችን ዘውድ የድኅነታችን መጀመሪያ የንጽሕናችንም መሠረት እኛን ስለማዳን ሰው የሆነ የእግዚአብሔርን ቃል በወለደችልን በድንግል ማርያም ተገኘልን። ሰው ከሆነ በኋላም ፍጹም አምላክ ነው ስለዚህም በድንግልና ወልደችው። ድንቅ የሆነ የመወለድዋ ችሎታ የማይመረመር ሊነገር የማይቻል ነው። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፪፤ በእርሱ ፈቃድ በአባቱ ፈቃድ በመንፈስ ቅዱስም ፈቃድ መጥቶ አዳነን። በድንግልና ፍጽምት የሆንሽ ማርያም ሆይ የድንግልናሽ ምሥጋናና ክብር ታላቅ ነው። እግዚአብሔር ካንቺ ጋር ቢሆን ባለሟልነትን አግኝተሻልና። ያዕቆብ ከምድር እስከ ሰማይ ደርሳ የእግዚአብሔር መላእክት ሲወጡባት ሲወርዱባት ያያት መሰላል አንቺ ነሽ። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፫፤ ሙሴ በነደ እሳት ሳትቃጠል ያያት ዕፅ አንቺ ንሽ ይኸውም መጥቶ በማኅፀንሽ ያደረው የእግዚአብሔር ልጅ ነው የመለኮቱ እሳትነት ሥጋሽን አላቃጠለውም። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፬፤ ዘር ያልተዘራባት እርሻ አንቺ ነሽ የሕይወት ፍሬ ከአንቺ ወጣ። ዮሴፍ የዋጃትና የከበረ ዕንቁን ያገኘባት ሣጥን አንቺ ነሽ ይኸውም መድኃኒታችን ኢየሱስ ክርስቶስ ነው በማኅፀንሽ አደረ በዚህ ዓልምም ወለድሸው። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፭፤ የመላእክት ደስታቸው የሆነ ጌታን የወለድሽ ሆይ ደስ ይበልሽ። የነቢያት ዜናቸው ንጽሕት ሆይ ደስ ይበልሽ እግዚአብሔር ከአንቺ ጋር ቢሆን ባለሟልነትን አግኝተሻልና ደስ ይበልሽ። የዓለም የሰው ሁሉ ደስታ የሆነ የመልአኩን ቃል ተቀብለሻልና ደስ ይበልሽ። ዓለምን ሁሉ የፈጠረ ጌታን የወለድሽ ሆይ ደስ ይበልሽ። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፮፤ በሚገባ የአምላክ እናት ተብለሻልና ደስ ይበልሽ። የሔዋን መድኃኒት ሆይ ደስ ይበልሽ። ፍጥረቱን ሁሉ የሚመግበውን እሱን ጡትሽን አጥብተሽዋልና ደስ ይበልሽ። የሕያዋን የጻድቃን) ሁሉ እናታቸው ቅድስት ሆይ ደስ ይበልሽ። ትለምኝልን ዘንድ ወደ አንቺ እናንጋጥጣለን። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፯፤ ድንግል ሆይ ቅድስት ሆይ ጌታን የወለድሽ ሆይ እኛን ለማዳን ድንቅ ምሥጢር (ተዋህዶ) በአንቺ ቢደረግ ንጉሥን ወልደሽልናልና ፍጥረታትን በልዩ ልዩ መልክ የፈጠረ የርሱን የገናንነቱን ነገር ፈጽመን መናገር አይቻለምና ዝም እንበል። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፰፤ ወደ ደብረሲና የወረደ ለሙሴ ሕግን የሰጠ የተራራውን እራስ በጽጋግ በጢስ በጨለማና በነፋስ የሸፈነ ፈርተው የቆሙትንም በነጋሪቶች ድምፅ የገሠፀ የአብ አካልዊ ቃል ነው። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፱፤ በትሕትና የተናገርሽ ተራራ ሆይ ይኸውም ወደ አንቺ የወረደው ነው። ሰውን የወደደ እርሱ ያለመለወጥ ባንቺ ሰው ሆነ። እንደ እኛ በሚናገር ሥጋ ፍጹም ሆኖ አምላክ በመንፈስ ቅዱስ በማህፀኗ አደረና ፍጹም ሰው ሆነ። አዳምን ያድነው ዘንድ ኃጢአቱንም ያስተሠርይለት ዘንድ በሰማያት (በሰማያዊ መዓርግ) ያኖረው ዘንድ በቸርነቱና በይቅርታው ብዛት ወደ ቀድሞው ቦታው ይመልሰው ዘንድ። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፲፤ የድንግልን ገናንነቷን ሊናገሩት አይቻልም። ጌታ መርጧታልና። የሚቀርበው በሌለ ብርሃን ውስጥ የሚኖር እርሱ መጥቶ አደረባት ዘጠኝ ወር በማኅፀንዋ አደረ የማይታይና የማይመረመር (ታይቶ የማይታወቅ) እርሱን በድንግልና ወለደችው። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፲፩፤ ነቢዩ ዳንኤል ያየው ያለ እጅ ከረጅም ተራራ የተፈነቀለው ያ ደንጊያ ከአብ ዘንድ የወጣው ቃል ነውና መጥቶ ያለ ወንድ ዘር ከድንግል ተወልዶ አዳነን። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፲፪፤ እንደ ንጹሕ ጫፍ ሆንሽ የሃይማኖትም መገኛ ነሽ የቀናች የቅዱሳን አባቶቻችን ሃይማኖታቸው ነሽ። አምላክን የወለድሽና በድንግልና የታተምሽ ንጽሕት ሆይ የአብን ቃል ወለድሽልን ኢየሱስ ክርስቶስ እኛን ለማዳን መጣ። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፲፫፤ የከበርሽ ጌታን የወለድሽ ሆይ የማይታይ ቃልን የተሸከምሸው የብርሃን እናቱ አንቺ ነሽ። እሱን ከወለደሽው በኋላ በድንግልና ኖረሻልና በፍጹም ምስጋና ያገኑሻል፡፡ <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፲፬፤ የአብ ቃል እናቱ ንጽሕት ድንግል ሆይ ስለአንቺ የሚነገረውን ነገር መናገር የሚቻለው ምን አንደበት ነው፤ ኪሩቤል ለሚሸከሙት ንጉሥ ዙፋኑ (ማደሪያው) ሆንሽ፤ የተከበርሽ ሆይ እናመሰግንሻልን የጌታችን የኢየሱስ ክርስቶስ እናቱ መልካሟ እርግብ ሆይ ስምሽን በልጅ ልጅ እንጠራለን። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፲፭፤ እናትና ገረድ ማርያም ሆይ ደስ ይበልሽ። የታቀፍሽውን መላእክት ያመሰግኑታል ኪሩቤልም በፍርሃት ይሰግዱለታልና ሱራፌልም ያለማቋረጥ ክንፋቸውን ዘርግተው የሚመሰገን ንጉሥ (የክብር ባለቤት) ይህ ነው፤ በይቅርታው ብዛት የዓለምን ኃጢአት ያስተሰርይ ዘንድ የመጣው ይህ ነው ይላሉ። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>"
          ]
        },
        wed: {
          name: "ረቡዕ",
          title: "ረቡዕ የሚጸለይ አምላክን የወለደች የእመቤታችን የድንግል ማርያም ምስጋና፤ ሦስተኛ ክፍል።",
          verses: [
            "፩፤ የምድር ሁለተኛ የሆንሽ ሰማይ ሆይ የሰማይ ሠራዊት (መላእክት) ንዕድ ነሽ ይላሉ። ድንግል ማርያም የምስራቅ ደጅ ናት። ሙሽራዋ ንጹሕ የሆነ ንጽሕት የሠርግ ቤት ናት። አብ በሰማይ አይቶ እንዳንቺ አላገኘምና አንድ ልጁን ላከው በአንችም ሰው ሆነ። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፪፤ አምላክን የወለድሽ እመቤታችን ሆይ ትውልድ ሁሉ አንችን ብቻ ያመሰግኑሻል። የእግዚአብሔር ሀገር (ከተማ) ሆይ ነቢያት ድንቅ ድንቅ ነገርን ተናገሩልሽ፤ ደስ የተሰኙ የጻድቃን ማደሪያ ሆነሻልና የምድር ነገሥታት ሁሉ በብርሃንሽ ይሄዳሉ። ሕዝቡም ሠራዊቶቻቸውም በብርሃንሽ ይሄዳሉ፤ ማርያም ሆይ ትውልድ ሁሉ ያመሰግኑሻል። ካንቺ ለተወልደውም ይሰግዱለታል ያገኑታልም። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፬፤ የዝናብ ውሃ የታየብሽ የእውነት ደመና አንቺ ነሽ። አብ የልጁ ምልክት አደረገሽ መንፈስ ቅዱስ አደረብሽ የልዑል ኃይል ጋረደሽ፤ ማርያም ሆይ ለዘለዓለም የሚኖር የአብን ልጅ ቃልን የወለድሽልን መጥቶም ከኃጢአት አዳነን። ደስ የተሰኘህ ሆነህ ምሥራችን የተናገርክ መልአኩ ገብርኤል ሆይ የተሰጠህ ክብር ታላቅ ነው ወደእኛ የመጣ የጌታን ልደት ነገርከን ለድንግል ማርያም ጸጋን የተመላሽ ሆይ እግዚአብሔር ካንቺ ጋር ነውና ደስ ይበልሽ ብለህ አበሰርካት። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፭፤ ጸጋን አገኘሽ መንፈስ ቅዱስ አደረብሽ የልዑል ኃይልም ጋረደሽ (ጸለለብሽ) ማርያም ሆይ በእውነት ቅዱሱን ወለድሽ ዓለምን ሁሉ የሚያድን መጥቶ አዳነን። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፮፤ አንደበታችን የድንግልን ሥራ ያመስግናል። ጌታችንና መድኃኒታችን ኢየሱስ ክርስቶስ በዳዊት አገር ከእርስዋ ስለተወለደ አምላክን የወለደች ማርያምን ዛሬ እናመስግናት አሕዛብ ኑ ማርያምን እናመስግናት። እናትና ድንግል ሁለቱንም ሆናለችና። ርኩሰት የሌለብሽና የአብ ቃለ መጥቶ ካንቺ ሰው የሆነ ንጽሕት ድንግል ሆይ ደስ ይበልሽ፣ ነውር የሌለብሽ ፍጽምትና ጉድፍ የሌለብሽ ሙዳይ ሆይ ደስ ይበልሽ። ስለቀደመ ሰው አዳም ሁሉተኛ አዳም የሆነ የክርስቶስ ማደሪያው የምትናገሪው ገነት ሆይ ደስ ይበልሽ። ከአባቱ ያልተለየ አንድ እሱን የተሸከምሽ ሆይ ደስ ይበልሽ። በክብር ጌጥ ሁሉ ያጌጠ እርሱ መጥቶ ሰው የሆነብሽ ንጽሕት የሠርግ ቤት ሆይ ደስ ይበልሽ። የመለኮት እሳት (ባሕርይ) ያላቃጠለሽ ዕፀ ጳጦስ ሆይ ደስ ይበልሽ። በኪሩቤል ላይ የሚቀመጠውን ሰማያዊ መለኮትን በሥጋ የተሸከምሽ ገረድና እናት ድንግልና ሰማይ ሆይ ደስ ይበልሽ። ስለዚህ ንጹሓን ከሆኑ መላእክት ጋር በፍጹም ደስታ ደስ ተሰኝተን እናመስግን በሰማይም ለእግዚአብሔር ምስጋና ይሁን በምድርም ዕርቅ ይሁን እንበል ክብርና ምስጋና ጌትነት ያለው እርሱ አንችን ወድዋልና። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፯፤ ከቅዱሳን ክብር የማርያም ክብር ይበልጣል፣ የአብን ቃል ለመቀበል በተገባ ተገኝታለችና። መላእክት የሚፈሩትን ትጉሆች በሰማይት የሚያመሰግኑትን ድንግል ማርያም በማኅፀንዋ ተሸከመቸው። ይህች ከኪሩቤል ትበልጣልች፣ ከሱራፌልም ትበልጣልች ከሦስቱ አካል ለአንዱ ማደሪያ ሆናለችና። የነቢያት ሀገራቸው ኢየሩሳሌም ይህች ናት። ለቅዱሳን ሁሉ የደስታቸው ማደሪያ ናት። በጨለማና በሞት ጥላ ውስጥ ለሚኖሩ ሰዎች ታላቅ ብርሃን ወጣላቸው። በቅዱሳን ላይ የሚያድር እግዚአብሔር እኛን ለማዳን ልዩ ከሆነች ድንግል ሰው ሆኗዋልና። ኑ ይህን ድንቅ እዩ። ስለ ተገለጠልን ምስጢር ምስጋና አቅርቡ። ሰው የማይሆን ሰው ሆኗልና። ቃል ተዋህዷልና። ጥንት የሌለው ሥጋ ጥንታዊ ቀዳማዊ ሆነ ዘመን የማይቆጠርለት መለኮት ዘመን ተቆጠረለት። የማይታወቅ ተገለጠ የማይታይ ታየ የሕያው የእግዚአብሔር ልጅ በእርግጥ ሰው ሆነ። ትላንት የነበረው ዛሬም ያለው መቼም የሚኖረው ኢየሱስ ክርስቶስ እንሰግድለት እናመስግነው ዘንድ አንድ ባሕርይ ነው። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፰፤ ነቢዩ ሕዝቅኤል ስለ እርስዋ መሰከረ ድንቅ በሆነ ታላቅ ቁልፍ የተዘጋች ደጅ ምሥራቅ አየሁ አለ ከኃያላን ጌታ በቀር ወደ እርስዋ ገብቶ የወጣ የለም። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፱፤ ኆኅትም ደጅም መድኃኒታችንን የወለደች ድንግል ናት። እርሱን ከወለደች በኋላ እንደ ቀድሞ በድንግልና ኖራለችና። መጥቶ ምሕረት ከሌለው ጠላት እጅ ያዳነን ጌታን የወለጅሽ ሆይ የማኅፅንሽ ፍሬ የተባረከ ነው፥ አንቺ ፍጽምትና የተባረክሽ ነሽ የእውነት አምላክ በሆነ በክብር ባለቤት ዘንድ ባለሟልነትን አግኝተሻልና በምድር ላይ ከሚኖር ሁሉ ይልቅ ገናንነትና ክብር ለአንቺ ይገባል። የአብ ቃል መጥቶ በአንቺ ሰው ሆነ። ከሰው ጋርም ተመላለሰ። መሓሪ ይቅር ባይ ሰውን ወዳጅ ነውና በልዩ አመጣጡ አዳነን። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>"
          ]
        },
        thu: {
          name: "ሐሙስ",
          title: "ሐሙስ የሚጸለይ አምላክን የወለደች የእመቤታችን የድንግል ማርያም ምስጋና፤ አራተኛ ክፍል።",
          verses: [
            "፩፤ ርኵሰት የሌለባት ድንግል ማርያም ሙሴ በበረሃ በነደ እሳት ጫፎቿ ሳይቃጠሉ ያያት ዕፅን ትመስላለች፤ የአብ ቃል በርስዋ ሰው ሆኗልና፣ እሳተ መለኮቱ (የመለኮቱ ባሕርይ) አላቃጠላትምና ከወለደችውም በኋላ ድንግልናዋ አልተለወጠምና ሰውም ቢሆን መለኮቱ አልተለወጠም በዕውነት አምላክ ነውና በዕውነት አምላክ የሆነ እርሱ መጥቶ አዳነን። <span class='rubric'>ቅድስት ሆይ ልምኝልን።</span>",
            "፪፤ አምላክን የወለድሽ እመቤታችን ሆይ ሁላችን እናገንሻልን። ይቅርታሽ ለሁላችን ይሆን ዘንድ ነውና።",
            "፫፤ ሔዋን እንጨት በልታ ባደረገችው ዓመፅ በባሕርያችን ያደረ የቀድሞው እርግማን በእርስዋ የጠፋልን አምላክን የወለደች ድንግል ማርያም የሁላችን መመኪያ ናት። ስለ ሔዋን የገነት ደጅ ተዘጋ ዳግመኛም ስለ ድንግል ማርያም ተከፈተልን። ከዕፀ ሕይወት እንበላ ዘንድ አደለን። ይኸውም እኛን ስለመውደድ መጥቶ ያዳነን የክርስቶስ ክብር ሥጋው ክብር ደሙ ነው። ስለ እርሷ ድንቅ ሆኖ የሚነገረውን ይህን ምሥጢር ማወቅ የሚቻለው ምን ልቡና ነው? መናገር የሚቻለው ምን አንደበት ነው? መስማት የሚቻለው ምን ጆሮ ነው? ሰውን የሚወድ እግዚአብሔር አንድ ብቻ የሆነ አምላክነቱ ሳይለወጥ ከዓለም በፊት የነበረ የአብ ቃል ከአብ ዘንድ መጥቶ ልዩ ከሆነች እናቱ ሰው ሆነ። ከወለደችውም በኋላ ድንግልናዋ አልተለወጠም። ስለዚህ አምላክን የወለደች እንደሆነች ታወቀች። የእግዚአብሔር የጥበቡ ስፋት ምን ይጠልቅ? በጻእር በምጥ በልብ ጋር ትወልድ ዘንድ የፈረደባት ማኅፀን የሕይወት መገኛ ሆነች ከባሕርያችን እርግማንን የሚያጠፋልንን ያለ ወንድ ዘር ወለደችልን። ስለዚህም ሰውን የምትወድ ሆይ ክብር ላንተ ይገባል፤ ቸርና የሰውነታችን መድኃኒትም ነህ እያልን እናመስግነው። <span class='rubric'>ቅድስት ሆይ ልምኝልን።</span>",
            "፬፤ ያለ ወንድ ዘር አምላክን የወለደች ድንግል የማኅፀንዋ ሥራ ምን ይደንቅ? ለዮሴፍ የታየው መልአኩ ከእርሷ በመንፈስ ቅዱስ የሚወለደው ያለ መለወጥ ሰው የሚሆነው የእግዚአብሔር ቃል ነው ብሎ መስክሯልና። ማርያም የዚህ ደስታ ዕፅፍ የሆነ እርሱን ወለደችው። መልአኩ ልጅ ትወልጃለሽ ስሙም አማኑኤል ይባላል አላት። ትርጓሜውም እግዚአብሔር ከእኛ ጋር ሆነ ማለት ነው። ዳግመኛ ወገኖቹን ከኃጢአታቸው የሚያድናቸው ኢየሱስ ይባላል። በችሎታው (በኃይሉ) ያድነን ዘንድ ኃጢአታችንንም ያስተሠርይልን ዘንድ ለዘለዓለም ክብር ይግባውና ሰው የሆነ እርሱን አምላክ እንደሆነ በተረዳ ነገር አውቀነዋልና። ልዩ ከሆነች ድንግል ማርያም ይህ የአምላክ መወለድ ምን ይደንቅ ቃልን ወሰነችው። ልደቱንም ዘር አልቀደመውም። በመወልዱም ንግልናዋን አልለወጠውም። ቃል ከአብ ያለ ድካም ወጣ። ከድንግልም ያለ ሕማም ተወለደ። ሰብአ ስገል ሰገዱለትም አምላክ ነውና ዕጣን አመጡለት ንጉሰም ነውና ወርቅ አመጡለት ስለእኛ በፈቃዱ ለተቀበለው መዳኛችን ለሆነ ሞቱም ከርቤ አመጡለት። ቸር ሰውን ወዳጅ የሆነ አንድ እርሱ ብቻ ነው ። <span class='rubric'>ቅድስት ሆይ ልምኝልን።</span>",
            "፭፤ ከአዳም ጎን አንዲት ዐፅም ማንሣት ምን ይደንቅ? ከእርሱ ሴትን ፈጠረ የሰው ፍጥረትንም ሁሉ ፈጠረ። ጌታ የአብ ቃል ተሰጠ። ከልዩ ድንግልም ሰው ሆነና አማኑኤል ተባለ ስለዚህ ሁል ጊዜ እርስዋን እንለምን፣ ከተወደደ ልጅዋ ታማልደን ዘንድ። በቅዱሳንና በሊቃነ ጳጳሳት ዘንድ ቸር ናት ደጅ የሚጠኑትን ወልዳላቸዋልችና ለነቢትም ትንቢት የተናገሩለትን ወልዳላቸዋለችና ለሐዋርያትም እስከ ዓለም ዳርቻ በስሙ ያስተማሩለትን ወልዳላቸዋለችና ሰማዕታትና ምዕመናንም የተጋደሉለትን የጥበቡ ጸጋ ብዛት የማይታወቅ ኢየሱስ ክርስቶስ ከእርስዋ ተወልዷልና የይቅርታውን ብዛት መርምረን እንወቅ (እንገፈልግ) መጥቶ አድኖናልና። <span class='rubric'>ቅድስት ሆይ ልምኝልን።</span>",
            "፮፤ እግዚአብሔር የባሕርይህን ፍሬ በዙፋንህ አኖራለው ብሎ ለዳዊት በእውነት ማለ እይጸጸትም። ጻድቅ እርሱ ዳዊት ክርስቶስ በሥጋ ከእርሱ እንዲወለድ ባመነ ጊዜ የእግዚአብሔርን ቃል ማደሪያ ፈልጎ ያገኝ ዘንድ ወደደ ይህንንም በታላቅ ትጋት ፈጸመ። ከዚህም በኋላ እነሆ በኤፍራታ ሰማነው ብሎ በመንፈስ ቅዱስ አሰምቶ ተናገረ። ይህቺውም አማኑኤል እኛን ለማዳን በሥጋ ይወልድባት ዘንድ የመረጣት የያዕቆብ አምላክ ማደሪያ ናት። ዳግመኛም ከነቢያት አንዱ ሚክያስ አንቺ የኤፍራታ ክፍል የሆንሽ ቤተልሔም ከይሁዳ ነገሥታት መሳፍንት አገር አታንሺም ወገኖቼ እሥራኤልን የሚጠብቃቸው ንጉሥ ካንቺ ይወጣልና፤ ከዛሬ ጀምሮ እስከ ዘለዓለም ድረስ ከቸር አባቱና ከመንፈስ ቅዱስ ጋር ምስጋና ስለተገባው ስለ ክርስቶስ ባንድ መንፈስ ቅዱስ ትንቢት የተናገሩት የነዚህ የሚክያስና የዳዊት ነገር ምን ይረቅ? <span class='rubric'>ቅድስት ሆይ ልምኝልን።</span>",
            "፯፤ ለእስራኤል የነገሠ ዳዊት ጠላቶቹ በተነሡበት ጊዜ ከቤተልሔም ምንጭ ውኃ ይጠጣ ዘንድ ወደደ የጭፍሮቹ አለቆች ፈጥነው ተነሡና በጠላቶቹ ከተማ ተዋግተው ሊጠጣ የወደደውን አመጡለት። ጻድቅ ዳዊት ግን ጨክነው ሰውነታቸውን ስለ እርሱ ለጦርነት ለሞት አሳልፈው እንደ ሰጡ ባየ ጊዜ ያን ውኃ አፈሰሰ ከእርሱም አልጠጣም ከዚህ በኋላ ለዘለዓለም ጽድቅ ሆኖ ተቆጠረለት። ሰማዕታት የዚችን ዓለም ጣዕም በዕውነት ናቁ ደማቸውንም ስለ እግዚአብሔር አፈሰሱ። ስለ መንግሥተ ሰማያትም መራራ ሞትን ታገሱ። እንደ ይቅርታህ ብዛት ይቅር በለን። <span class='rubric'>ቅድስት ሆይ ልምኝልን።</span>",
            "፰፤ ከቅድስት ሥላሴ አንዱ ወልድ መዋረዳችንን አይቶ ከሰማየ ሰማያት ወርዶ ባሕርዩን ዝቅ አደረገና መጥቶ በድንግል ማኅፀን አደረ። ከብቻዋ ከኃጢአት በቀርም አንደኛ ሰው ሆነ፤ ነቢያት ትንቢት እንደተናገሩለት በቤተልሔም ተወለደ። ፈጽሞ አዳነን ወገኖቹም አደረገን። <span class='rubric'>ቅድስት ሆይ ልምኝልን።</span>"
          ]
        },
        fri: {
          name: "ዐርብ",
          title: "ዓርብ የሚጸለይ አምላክን የወለደች የእመቤታችን የድንግል ማርያም ምስጋና፤ አምስተኛ ክፍል።",
          verses: [
            "፩፤ ከሴቶሽ ተለይተሽ የተባረክሽ ነሽ። የማኅፀንሽም ፍሬ የተባረክ ነው ያለርኵሰት አምላክን የወለድሽ ድንግል ማርያም ሆይ እውነተኛ ፀሐይ ከአንቺ ወጣልን (ጌታ ተወለደልን) በክንፈ ረድኤቱም አቀረበን። እርሱ ፈጥሮናልና። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፪፤ አምላክን የወለድሽ እመቤታችን ሆይ የብርሃን እናት ነሽና አንችን ብቻሽን በክብር በምስጋና እናገንሻለን።",
            "፫፤ የተባረክሽ አንቺ ከመላእክት ትበልጫለሽ ከደቂቀ አዳምም ትበልጫልሽ ከድቂቀ አዳምም ትበልጫለሽ። ከአሳቦች ሁሉ ትበልጫልሽ ገናንነትሽን መናገር የሚቻለው ማነው አንቺን የሚመስል የለምና። ማርያም ሆይ መላእክት ያገኑሻል ሱራፌልም ያመሰግኑሻል። በኪሩቤልና በሱራፌል ላይ አድሮ የሚኖር ጌታ መጥቶ በማኅፀንሽ አድሮአልና። ሰውን የሚወድ ወደ እርሱ አቀረበን፣ ክብር ምስጋና ያለው እርሱ የእኛን ሞት ተቀብሎ የእርሱን ሕይወት ለእኛ ሰጠን። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፬፤ የደናግል መመኪያቸው አምላክን የወለድሽ ድንግል ማርያም ሆይ የተባረክሽ ነሽ የማኅፀንሽም ፍሬ የተባረከ ነው። ከዓለም በፊት የነበረ እርሱ ሰው ሆኖዋልና ከአንቺ ተወልደ ሥጋችንን ነሣ (ተዋሐደ) መንፈስ ቅዱስንም ሰጠን። በቸርነቱ ብዛት መሳዮቹ አደረገን ጸጋንና ክብርን ከተቀበሉ ብዙ ሴቶች አንቺ ትበልጫልሽ አምላክን የወለድሽ ማርያም ሆይ ልዑል እግዚአብሔር ያደረብሽ (የከተመበሽ) ረቂቅ ከተማ ነሽ። በኪሩቤልና በሱራፌል ላይ የሚኖረውን ጌታን በመኻል እጅሽ ይዘሸዋልና። በቸርነቱ ብዛት ሥጋዊ ፍጥረትን ሁሉ የሚመግብ እርሱ ጡትሽን ይዞ ጠባ። ይኸውም ሁሉን የሚያድን አምላካችን ነው። ለዘለዓለሙ ይጠብቀናል። እንሰግድለትን እናመስግነው ዘንድ እርሱ ፈጥሮናና። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፭፤ ድንግል ማርያም የሽቱ መኖሪያና የሕይወት ውኃ ምንጭ ናት። የማኅፀንዋ ፍሬ ሰውን ሁሉ አድኖአልና። ከእኛም እርግማንን አጠፋልን። በመካከለችንም ሆኖ በስቀሉ አስታረቀን በልዩ ትንሣኤውም ሰውን ዳንመኛ ወደ ገነት መለሰው። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፮፤ ንጽሕት ድንግል ማርያም የታመነች አምላክን የወለደች ናትሽ። ለሰዎች ልጆችም የምሕረት አማላጅ ናት። ኃጢአታችንን ያስተሠርይልን ዘንድ ወደ ልጅሽ ወደ ክርስቶስ ለምኝልን። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፯፤ ድንግል ማርያም በቤተመቅደስ አሰምታ ትናገር ነበር። መልአኩ ቅድስት ድንግል ሆይ ሰልምታ ይገባሻል ብሎ አክብሮ ከነገረኝ ነገር በቀር ምንም ምን ሌላ የማውቀው እንደሌለኝ እግዚአብሔር ያውቃል አለች። የማይቻለውን ቻልሽ የማይወሰነውንና ምንም ምን የሚወስነው የሌለውን ወሰንሽ። በክብር ሁሉ ላይ ጸጋን የተመላሽ ሆይ ምስጋናሽ ይበዛል ክብርሽ ፍጹም ነው። የአብ ቃል ማደሪያ ሆነሻልና የክርስቲያን ወገኖች ምእመናንን የምትሰበስቢያቸውና ማሕየዊ የሚያድኑን ለሆኑ ለሥላሴ ሰጊድን (መሰገድን) የምያስተምሪላቸው ሰፊ መጋረጃ ሙሴ ያየውን የእሳት ዓምድ የተሸከምሽ አንቺ ነሽ። ይኸውም መጥቶ በማኅፀንሽ ያደረው የእግዚአብሔር ልጅ ነው። ሰማይና ምድር ለማይወስኑት የታመንሽ አንቺ ነሽ። ከምድር ወደሰማይ ለማረግ መሰላል ሆንሽ ብርሃንሽ ከፀሐይ ብርሃን ይበልጣል። ቅዱሳን በፍጹም ደስታ ያዩት ኮከብ ካንቺ የተወልደ ምሥራቅ አንቺ ነሽ። አንቺ ማርያም ግን ጸጋን የተመላሽ ሆይ ደስ ይበልሽ የሚል ቃልን ሰማሽና መጥቶ ያዳነን የፍጥረት ሁሉ ገዥ የሆነ ንጉሥን ወለድሽልን። መሐሪ ነው፣ ሰውንም ወዳጅ ነው። ስለዚህ ማርያም ሆይ የተባረክሽ ነሽ፣ የማኅፀንሽም ፍሬ የተባረከ ነው። ጸጋን የተመላሽ ሆይ እግዚአብሔር ካንቺ ጋር ነውና ደስ ይበልሽ እያልን መልአኩ ገብርኤል እንዳመሰገነሽ እናመሰግንሻለን። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>"
          ]
        },
        sat: {
          name: "ቅዳሜ",
          title: "ቅዳሜ የሚጸለይ አምላክን የወለደች የእመቤታችን የድንግል ማርያም ምስጋና፤ ስድስተኛ ክፍል።",
          verses: [
            "፩፤ ንጽሕት ነሽ ብርህትም ነሽ። ጌታን በመኻል እጅሽ የያዝሽው ሆይ በሁሉ የተቀደሽ ነሽ። ፍጥረት ሁሉ ቅድስት ሆይ ለምኝልም ብለው እየጮኹ ካንቺ ጋር ደስ ይላቸዋል። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፪፤ ጸጋን የተመላሽ ሆይ ደስ ይበልሽ። ባለሟነትን አግኝተሻልና ደስ ይበልሽ። እግዚአብሔር ካንቺ ጋር ነውና ደስ ይበልሽ።",
            "፫፤ ግርማ ያለሽ ድንግል ሆይ ገናነትሽን እናመሰግናለን እናደንቃለን። እንደ መልአኩ ገብርኤልም ምስጋና እናቀርብልሻለን የባሕርያችን መዳን በማኅፀንሽ ፍሬ ተገኝቷልና። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፬፤ እንደ ሠርግ ቤት ጉድፍ የሌለብሽ ነሽ መንፈስ ቅዱስ አድሮብሻልና። የልዑል ኃይልም ጸልሎሻልና። ማርያም ሆይ ለዘለዓለም የሚኖር መጥቶ ከኃጢአት ያዳነን የአብ ልጅ ቃልን በእውነት ወለድሽ። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፭፤ ከዳዊት ሥር የተገኘሽ ባሕርይ (ዘር) አንቺ ነሽ መድኃኒታችን ኢየሱስ ክርስቶስን በሥጋ ወልደሽልናልና። ከአብ የተወለደ ከዓለም በፊት የነበረ አንዱ ቃል ራሱን (ባሕርዩን) ሰወረ ካንቺም የተገዥን (ሰውን) አርአያ ነሣ። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፮፤ አምላክን ያለርኵሰት የወለድሽው ሆይ የምድር ሁለተኛ ሰማይን ሆንሽ፣ እውነተኛ ፀሐይ ካንቺ ወጥቶልናልና። እንደነቢያት ትንቢትም ያለዘርና ያለመለወጥ ወደልሽው። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፯፤ ከተለዩ የተለየች የተባልሽ የኪዳን ጽላት ያለብሽ የተሰወረ መና ያለበት የወርቅ መሶብ ያለብሽ ደብተራ ድንኳን አንቺ ነሽ። ይኸውም መና የተባለው መጥቶ በድንግል ማርያም ማኅፀን ያደረው የእግዚአብሔር ልጅ ነው። የአብ ቃል በርስዋ ሰው ሆነ መጥቶ ያዳነን የባሕርይ ንጉሥን በዓለም ውስጥ የወደችው የሚናገር በግ የክርስቶስ እናቱ ገነት ደስ ይላታል ለዘለዓለም የሚኖር የአብ ልጅ እርሱ መጥቶ ከኃጢአት አድኖናልና። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፰፤ የንጉስ ክርስቶስ እናቱን ተባልሽ እርሱን ከወለድሽ በኋላም በድንግልና ኖርሽ። ድንቅ በሆነ ምሥጢርም (ተዋህዶ) አማኑኤልን ወለድሽው ስለዚህም ባለመለወጥ አጸናሽ። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፱፤ እግዚአብሔር በላይዋ ተቀምጦባት ያዕቆብ ያያት መሰላል አንቺ ነሽ በሁሉ በኩል የማይመረመር እርሱን ተፈትሖ በሌለበት ማኅፀንሽ ተሸክመሽዋልና። እኛን ስለማዳን ካንቺ ሰው በሆነ በጌታችን በኢየሱስ ክርስቶስ ዘንድ አማላጅ ሆንሽን። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፲፤ የተባረክሽና ንጽሕት የሆንሽ አዳራሽ ሆይ እነሆ ጌታ የፈጠረውን ዓለም ሁሉ በይቅርታው ብዛት ያድን ዘንድ ካንቺ ወጣ (ተወለደ) ፈጽመን እናመስግነው። ቸርና ሰውን ወዳጅ ነውና። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፲፩፤ ያለርኩሰት ድንግል የሆንሽ ጸጋን የተመላሽ ሆይ ደስ ይበልሽ፤ የዓለም ሁሉ መክበሪያ ንጽሕት ጽዋ ነሽ። የማትጠፊ ፋና ነሽ የማትፈርሽ መቅደስ ነሽ። የቅዱሳን መደገፊያቸው (መጠጊያቸው) የማትለወጪ የሃይማኖት በትር ነሽ፣ ቸር አዳኛችን ወደ ሆነ ልጅሽ ለምኝልን ፈጽሞ ይቅር ይለንና ይምረን ዘንድ ኃጢአታችንንም ያስተሠርይልን ዘንድ። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>"
          ]
        },
        sun: {
          name: "እሁድ",
          title: "በሰንበተ ክርስቲያን እሑድ የሚጸለይ አምላክን የወለደች የእመቤታችን የድንግል ማርያም ምስጋና፤ ሰባተኛ ክፍል።",
          verses: [
            "፩፤ ከሴቶሽ ይልቅ ተለይተሽ የተባረክሽ ሆይ የተወደድሽ ተባልሽ። ከተለዩ የተለየች በውስጧም የኪዳን የሕግ ጽላት ያለባት የምትባይ ሁሉተኛ ክፍል አንቺ ነሽ ኪዳንም በእግዚአብሔር ጣቶሽ የተጻፉ ዓሥሩ ቃላት ናቸው። ያለመለወጥ ካንቺ ሰው የሆነ መድኃኒታችን ኢየሱስ ክርስቶስ ደገኛ ስሙን መጀመሪያ ስሙን አስቀድሞ በየውጣ ነገረን፣ ለአዲስ ኪዳንም አስታራቂ ሆነ። በከበረ ደሙ ፈሳሽነት ወይም መፍሰስ ያመኑትንና ንጹሓን የሆኑትን ወገኖች አነጻቸው። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፪፤ ሁል ጊዜ ንጽሕት የሆንሽ አምላክን የወለድሽ እምቤታችን ሆይ ሁላችን ስለዚህ እናገንሻለን ሰውን በሚወድ በጌታ ዘንድ ይቅርታን እናገኝ ዘንድ እንለምንሻለን ወዳንቺም እናንጋጥጣልን።",
            "፫፤ ከማይነቅዝ እንጨት የተቀረፀ በውስጥና በውጭ በወርቅ የተለበጠ ታቦት ያለመለየትና ያለመለወጥ ሰው የሆነ የእግዚአብሔርን ቃል ይመስልልናል። ይኸውም መለውጥ የሌለበት ንጹሕ መለኮት ነው። ከአብ ጋር የተካከለ ነው ለንጽሕት በራሱ አበሠራት። በልዩ ጥበብ ያለ ወንድ ዘር እንደ እኛ ሆነ መለኮቱን አዋሕዶ ያለ ርኵሰት ባንቺ ሰው ሆነ። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፬፤ በእግዚአብሔር ሥዕል የተሣሉ ኪሩቤል የሚጋርዱሽ መቅደስ አንቺ ነሽ። ንጽሕት ሆይ ያለመለወጥ ካንቺ ሰው የሆነው ቃል ኃጢአታችንን የሚያስተሠርይልንና አበሳችንን የሚደመስስልን ሆነ። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፭፤ የተሠወረ መና ያለብሽ የንጹሕ ወርቅ መሶብ አንቺ ነሽ መናም ከሰማይ የወረደውና ለዓለም ሁሉ ሕይወትን የሚያድለው ኅብስት ነው። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፮፤ ሁል ጊዜ ብርሃንነት ያለውን ፋና የተሸከምሽ የወርቅ መቅረዝ አንቺ ነሽ ይኸውም ፋና የዓለም ብርሃን ነው። ጥንት ከሌለው ብርሃን የተገኘ ብርሃን ነው። ከእውነተኛ አምላክ የተገኘ እውነተኛ አምላክ ነው። ያለ መለወጥ ከአንቺ ሰው የሆነው ነው። በመምጣቱም (ሰው በመሆኑም) በጨለማና በሞት ጥላ ውስጥ ለምንኖር ለእኛ አበራን በልዩ የጥበቡ ምሥጢር በሥጋዌ የልቦናችንን እግር ወደ ሰላም መንገድ አቀናልን። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፯፤ ቡሩክ ከቤተ መቅደስ ይዞሽ የወጣ እሳትነት ያለውን ፍሕም የተሸከምሽ የወርቅ ማዕጠንት አንቺ ነሽ ፍሕም የተባለውም ኃጢአትን የሚያስተሠርይና በደልን የሚደመስስ ነው። ይኸውም ካንቺ ሰው የሆነና ራሱን የተወደደ መሥዋዕት አድርጎ ያሳረገ የእግዚአብሔር ቃል ነው። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፰፤ የእግዚአብሔርን ቃል የወለድሽልን መልካሟ ርግብ ማርያም ሆይ ደሽ ይበልሽ። ከዕሴይ ሥር የወጣሽ መዐዛሽ ያማረ አበባ አንቺ ነሽ። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፱፤ ሳይተክሏትና ውሃ ሳያጠጧት የለመለመች የአሮን በትር ነበረች ያለ ዘር ሰው ሆኖ ያዳነን እውነተኛ አምላክችንን ክርስቶስን የወለድሽልን ሆይ አንቺ እንደርሷ ነሽ። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፲፤ ጸጋን የተመላሽ ሆይ ከቅዱሳን ሁሉ ይልቅ ትለምኝልን ዘንድ ላንቺ ይገባል። አንቺ ከሊቃነ ጳጳሳት ትበልጫለሽ ከነቢያትም ከመምህራንም ትበልጫለሽ። ከሱራፌልና ከኪሩቤል ግርማ የሚበልጥ የመወደድ ግርማ አለሽ። በእውነቱ የባሕርያችን መመኪያ አንቺ ነሽ። ለሰውነታችንም ሕይወትን የምትለምኝ ነሽ። ወደ ጌታችንና መድኃኒታችን ኢየሱስ ክርስቶስ ለምኝልን ፤ እርሱን በማመን በቀናች ሃይማኖት ያጸናን ዘንድ ይቅርታውንና ምሕረቱን ይሰጠን ዘንድ በቸርነቱ ብዛት ኃጢአታችንን ያስተሠርይልን ዘንድ። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፲፩፤ <span class='rubric'>ልመናዋ ክብሯ የልጇም ቸርነት ከልጇ ከወዳጇ ከሕዝበ ክርስቲያኑ ጋራ ለዘለዓለሙ ይኑር፤ አሜን።</span>"
          ]
        }
      },
      anqetse: {
        title: "አንቀጸ ብርሃን",
        sub: "ኢትዮጵያዊው ቅዱስ ያሬድ የደረሰው የአምላክ እናት ምስጋና",
        sections: [
          { num: "፩", text: "ኢትዮጵያዊው ቅዱስ ያሬድ የደረሰው የአምላክ እናት ምሥጋና፤ ለእውነተኛ ፈራጅ ለአምላክ እናት ምስጋናና አገልግሎት ይገባታል ።" },
          { num: "፪", text: "ቅድስት ሆይ ብፅዕት ነሽ የተመሰገንሽና የተባረክሽ ነሽ ። የከበርሽና ከፍ ከፍ ያልሽ ነሽ የብርሃን መውጫ የሕይወት መሰላል ነሽ አምላክን የወለድሽ እመቤታችን ድንግል ማርያም ሆይ ከተለዩ የተለየሽ የመለኮት ማደሪያ ነሽ ከፍጥረት ሁሉ ይልቅ የተከበርሽ ሆይ አብ የወደደሽ ወልድ ያደረብሽ መንፈስ ቅዱስ ያረፈብሽ (የጸለለብሽ) ተባልሽ ። በምድር ላይ ከፍተኛ አርያም የሆንሽ ከሰማያት በላይ ያለ የአርያም የልዑል ስፍራ ምትክ አንቺ ነሽ፤ ቅዱሳን ነቢያት ካህናትና ነገሥታት ያንቺ ምሳሌ አድርገው በውስጧ የኪዳን የሕግ ጽላት ያለባት ቅድስተ ቅዱሳን ከተለዩ የተለየችውን ሠሩ ። <span class='rubric'>ቅድስት ሆይ ልጅሽ ይቅርታውን ያድለን ዘንድ ለምኝልን ።</span>" },
          { num: "፫", text: "የአምላክ ልጅ ካንቺ ሰው ስለ መሆኑ ስላንቺም ከምድር ወደ አርያም ወደ መንግሥተ ሰማያት የቀረብን ሆን በአንቺና በልጅሽ ስም የቀረብን ሆን ።" },
          { num: "፬", text: "ዐሥሩ ቃላት በጣቶቹ የተጻፉ የፍጥረት ሁሉ ጌታ ያውም የአምላክ ልጅ በማኅፀንሽ አደረ ። አብ በሥልጣኑ አጸናሽ መንፈስ ቅዱስም ጸለለብሽ አነፃሽ የልዑል ኀይልም አጸናሽ ። ኢየሱስም ያንችን ሥጋ ለበሰ በታላቅ ቃል ጮኾ መጽሐፍ የሕይወት ውኃ ምንጭ ከሆዱ ይፈልቃል እንዳለ ማንም የተጠማ ቢኖር ወደኔ መጥቶ ይጠጣ አለ ። <span class='rubric'>ቅድስት ሆይ ልጅሽ ይቅርታውን ያድለን ዘንድ ለምኝልን ።</span>" },
          { num: "፭", text: "አብ አስቀድሞ በየውጣ ነገረን የውጣ የተባሉ በእግዚአብሔር ጣቶች የተጻፉ ዐሥሩ ቃላት ናቸው ። ልጅህ ጌታችንና መድኃኒታችን ኢየሱስ ክርስቶስ አንተ ብቻ አባቱ እንደ ሆንክ እርሱም ብቻ ልጅህ እንደ ሆነ አስተማረን ፤ እንዲሁም በሰማይ እናት በምድር አባት የለም ብለን እናምናለን ። መምጣቱን ከአባቱና ከእውነት መንፈስ ከጰራቅሊጦስ በቀር የሚያውቅ ሳይኖር ከሰማይ ወረደ ብለን እናምናለን ። በማኅፀንሽ አደረና ዘጠኝ ወር ተሸከምሽው ሰማያት ደስ ተሰኙ ምድርም ደስ ተሰኘች ። በልጅሽ መወለድ መልአክ ምሥራች ተናገረ ። የሰማይ ጭፍሮችም መላእክትም ምስጋና በሰማይ ለእግዚአብሔር ይሁን በምድርም ላይ ሰላም በሰውም እርሱ በሚፈቅደው እያሉ አመሰገኑ ። እረኞችም በቤተልሔም ካዩትና ከሰሙት የተነሣ አደነቁ ፤ የጥበብ ሰዎች ብልሆች ሰዎች ለልጅሽ ሊሰግዱና አንቺን ሊያገለግሉ ኮከብን አይተው ከሩቅ አገር መጡ ። ከምሥራቅ ጀምሮ መርቶ እስከ ቤተልሔም ያደረሳቸው ያ ኮከብ አንቺ ከሕፃንሽ ጋራ ባለሽበት ቦታ ላይ ቆመ ። እነዚያ ብልሆች ሰዎች አይተው በታላቅ ደስታ ደስ ተሰኙ ። ወደ እርሱ ወደ ሕፃንሽ ገቡና በፊቱ ቆሙ በምድር ላይ ወድቀው ሰገዱለት ። ሣጥናቸውንም ከፈቱና ወርቅ ዕጣን ከርቤን እጅ መንሻ አድርገው አገቡለት ፤ የወገኖችህን ልመናቸውንና መሥዋዕታቸውን ትቀበል ዘንድ ኃጢአታቸውንም ታስተሠርይላቸው ዘንድ የመጣህ አምላካችን ሆይ እጅ መንሻ አገባንልህ ፤ ለከበረ ስምህም ካንተ የተገኘውን ዕጣን አቀረብንልህ አሉት ። <span class='rubric'>ቅድስት ሆይ ልጅሽ ይቅርታውን ያድለን ዘንድ ለምኝልን ።</span>" },
          { num: "፮", text: "ከንጹሓን ይልቅ ንጽሕት የሆንሽ አንቺ ነሽ ፤ ከማይነቅዝ እንጨት እንደ ተሠራ በወርቅ እንደ ተጌጠና ዋጋው ብዙ በሆነ በሚያበራ ዕንቍ እንደተለበጠ ታቦት በቤተ መቅደስ ውስጥ የኖርሽ የተመረጥሽ ድንግል ነሽ ። እንዲህ ሆነሽ በቤተ መቅደስ ውስጥ ኖርሽ መላእክትም ዘወትር ምግብሽን ያመጡ ነበር ፤ መላእክት እየጐበኙሽ እንዲህ ዓሥራ ሁለት ዓመት ኖርሽ ። መጠጥሽም የሕይወት መጠጥ ነበር ምግብሽም የሰማይ ኅብስት ነበር ። አባትሽ ዳዊት በመሰንቆ አመሰገነ በትንቢት መንፈስም በመንፈስ ቅዱስም በገና እየደረደረ እንዲህ ብሎ ዘመረ ፤ ልጄ ሆይ ስሚ እዪም ጆሮሽንም አዘንብዪ ሕዝብሽንና የአባትሽን ቤት እርሺ ንጉሡም ውበትሽን ይወዳል እርሱ ጌታሽ ነውና ለእርሱም ስገጂ ። <span class='rubric'>ቅድስት ሆይ ልጅሽ ይቅርታውን ያድለን ዘንድ ለምኝልን ።</span>" },
          { num: "፯", text: "ከንጹሓን ካልበደሉ መላእክት ወገን የሆነና በደል የሌለበት በሁሉ ጌታ ፊት የሚቆም ከደጋጎቹ መላእክት ወገን የሆነ መልአኩ ገብርኤል አበሠረሽ እንዲህም አለሽ ፤ ጸጋን ያገኘሽ ሆይ ደስ ይበልሽ እግዚአብሔር ካንቺ ጋር ነው ከሴቶች ይልቅ የተባረክሽ ነሽ የሁሉ ገዥ በሆነ እግዚአብሔር ዘንድ ባለሟልነትን አገኘሽ ። እነሆ ትፀንሻለሽ ልጅም ትወልጃለሽ ስሙንም ኢየሱስ ትይዋለሽ እርሱ ታላቅ ነው ፤ የልዑል እግዚአብሔር ልጅ ይባላል እግዚአብሔር አምላክም የአባቱን የዳዊትን ዙፋን ይሰጠዋል ለዘላለሙ የያዕቆብን ወገን ይገዛል ለመንግሥቱም ፍጻሜ የለውም ። መንፈስ ቅዱስ ያድርብሻል የልዑል ኀይልም ይጸልልሻል ። ካንቺ የሚወለደውም ቅዱስ ነው ፤ <span class='rubric'>ቅድስት ሆይ ካንቺ የተወለደው ይቅርታውን ያድለን ዘንድ ለምኝልን ።</span>" },
          { num: "፰", text: "የንጽሕና አዳራሽና ከተለዩ የተለየሽ መቅደስ አንቺ ነሽ ፤ የብርሃን መጋረጃና የማይመረመር የክብር (የጌትነት) ዙፋን አንቺ ነሽ ። ቅድስት ማርያም ሆይ መንፈስ ቅዱስ መጥቶ ስላደረብሽና የልዑል ኃይል ስለ ጸለለብሽ ቅድስተ ቅዱሳን ከተለዩ የተለየች በሆነች መቅደስ መሰልንሽ ። የብርሃን መጋረጃ ነሽ ማለታችን ግን የአብ ቃል የሆነ መድኃኒታችን ኢየሱስ ክርስቶስ በማኅፀንሽ ስለተሠወረ ነው ። ይኸውም በላይ ያለ የሁሉ ጌታ ነው ። መላእክትና የመላእክት አለቆች መናብርት ሥልጣናት አጋዕዝት ኃይላት ሊቃናት መኳንንት የሚያመሰግኑት ነው ፤ ልጅሽንም በዚህ ዓለም በወለድሽው ጊዜ ዓይኖቻቸው ብዙዎች የሆኑ ኪሩቤልና ክንፎቻቸው ስድስት የሆኑ ሱራፌል በበረት ውስጥ ጋረዱልሽ ። የብርሃን ደመናዎችም ከበቡሽ ፤ የመላእክት አለቆች የመላእክት ሠራዊትና የሰማይ ጭፍሮች በመፍራትና በመንቀጥቀጥ በፊትሽ ቆሙ ። በዚህም ዓለም ኪሩቤልና ሱራፌል በሰማያት ካለው ምስጋናቸው ወይም ከቀድሞ ምስጋናቸው ወገን ባልሆነ በሌላ (በአዲስ) ምስጋና አመሰገኑሽ ። ፍጥረትን ሁሉ ሰብስቦ የያዘና ፍጥረቱን ሁሉ የሚመግብ ጌታቸው በብብትሽ (በክንድሽ) ተቀምጦ ጡትሽን እንደ ሕፃን ሲጠባ ባዩ ጊዜ በአርያም ፈለጉና በዚህ ዓለም እንደ ቀድሞው ከአባቱና ከመንፈስ ቅዱስ ጋር አገኙት ፤ የጌታ ትሕትናውን ባዩ ጊዜም ዓይኖቻቸውን ወደ ላይ ወደ አርያም ከፍ ከፍ አደረጉ ፤ ክንፋቸውንም ዘርግተው ለሁሉ ጌታ ላንተ በሰማይ ምስጋና ይገባሃል እያሉ ጌታቸውን አመሰገኑ ። ዳግመኛም በዋሻ በጎል ውስጥ አንቺን ከሕፃንሽ ጋር አይተው በምድር ላይ ሰላም (ፍቅር አንድነት ሆነ) አሉ ። ካንቺ የነሣውን የኛን ሥጋ ለብሶ ባዩት ጊዜም ሰውን ምንኛ ወደደው ብለው ሰገዱለት ። ነቢዩ ዳዊትም እንዲህ ብሎ ትንቢት ተናገረ እግዚአብሔር በሰማይና በማደሪያው ቦታ ሆኖ በምድር ወደሚኖሩት ሁሉ ተመለከተ የሰውንም ልጆች ሁሉ አየ ፤ ንጉሥ ውበትሽን ወደደ ። ለዘላለም ማረፊያዬ ይህች ናት መርጫታለሁና በእርሷ አድራለሁ አለ ። <span class='rubric'>ቅድስት ሆይ ልጅሽ ይቅርታውን ያድለን ዘንድ ለምኝልን ።</span>" },
          { num: "፱", text: "የተለየሽና ደግ የሆንሽ የተመሰገንሽና የተባረክሽ የከበርሽና ከፍ ከፍ ያልሽ ሆይ ፤ የሕይወት ኅብስት ባለበት በወርቅ መሶብ መሰልንሽ ። የሕይወት ኅብስትም (ይኸውም) በቀኙ ካሉ ጻድቃን ጋር እርሱን ለሚያምን በሃይማኖትና ፈቃደኛ በሆነ ልብ ከእርሱ ለሚበላም ሁሉ ሕይወትን የሚሰጥ ከሰማይ የወረደ ነው ። <span class='rubric'>ቅድስት ሆይ ልጅሽ ይቅርታውን ያድለን ዘንድ ለምኝልን ።</span>" },
          { num: "፲", text: "የብልሃተኛ እጅ ያልሠራት በውስጧም መብራት የሚያበሩባት የወርቅ መቅረዝ አንቺ ነሽ ፤ ራሱ የአብ ብርሃን ያበራባታል እንጂ ። ከብርሃን የተገኘ ብርሃን ወደ አንቺ መጥቶ አደረ በአምላክነቱም በዓለም ሁሉ አበራ ። ጨለማን ከሰዎች ላይ አራቀ ፤ እኔ የዓለም ብርሃን ነኝ በብርሃኔ እመኑ ብርሃን ሳለላችሁ ተመላለሱ ብሎ በሚያድን ቃሉ አዳነን ። <span class='rubric'>ቅድስት ሆይ ልጅሽ ይቅርታውን ያድለን ዘንድ ለምኝልን ።</span>" },
          { num: "፲፩", text: "ከሁሉ ጌታ የተገኘ የሁሉ ጌታ ከብርሃን የተገኘ ብርሃን በእውነት የሁሉ ጌታ (የባሕርይ አምላክ ከሆነ የተገኘ እውነተኛው የሁሉ ጌታ) የተወለደ እንጂ የተፈጠረ ያይደለ በህልውና በአኗኗር ከአባቱ ጋር የተካከለ በሰማይና በምድር ያለው ሁሉ በእርሱ የተፈጠረ እኛን ሰዎችን ስለማዳን የወረደው ። ክርስቶስ ከቅድስት ድንግል ማርያም ፈጽሞ ሰው ሆነ ። በመምጣቱም አበራልን ፍጹም ደስታንም አበሠረን ወደ አባቱም አቀረበን (አስታረቀን) ወደ ሕይወት ጐዳናም መራን የዘለዓለም ሕይወትንም ሰጠን ። ነቢዩ ኢሳይያስ እርሱን በማመን ከሕጉ የተነሣ በትንቢት እያደነቀ ሕግህ በምድር ላይ ብርሃን ነው አለ ። አረጋዊ ካህንና የእግዚአብሔርን ትእዛዝ የጠበቀ ጻድቅና ንጹሕ ዘካርያስ ፈጽሞ አደነቀ መናገርም ጀመረና እንዲህ አለ ፤ አምላካችን በይቅርታውና በምሕረቱ በአርያም (በልዕልና) ሆኖ ጐበኘን ። በጨለማና በሞት ጥላ ውስጥ ለሚኖሩትም ብርሃኑን ይገልጥላቸው ዘንድ ተወለደ ፤ ይቅር ይለን ይምረንም ዘንድ እግሮቻችንን ወደ ሰላም መንገድ አቀናልን ። <span class='rubric'>ቅድስት ሆይ ልጅሽ ይቅርታውን ያድለን ዘንድ ለምኝልን ።</span>" },
          { num: "፲፪", text: "እመቤታችን ሆይ የቅዱሳንና የምእመናንን ሁሉ ጸሎት በማዕጠናቸው ከምድር ወደ ሰማይ በሚያሳርጉ በሰማያውያን የካህናት አለቆች እጆች ውስጥ ባለ የወርቅ ማዕጠንት እንመስልሻለን ። እንዲሁም ስምሽን በመጥራት የሰው ልጆችን ልመና ወደ ልዩ ሦስት አብ ወልድ መንፈስ ቅዱስ ያሳርጋሉ ። የወገኖችሽንም ኃጢአት ታስተሠርይ ዘንድ ከአብ ከወልድ ከመንፈስ ቅዱስ ተፈቅዶልሻል ፤ ለሰዎች ልጆች የዘለዓለም ሕይወት ድልድይ ትሆኚ ዘንድ የዓለም ሁሉ መድኃኒት ሆይ ለምእመናን ወገኖችሽ መድኃኒታቸው ልትባዪ ይገባሻል ። <span class='rubric'>ቅድስት ሆይ ልጅሽ ይቅርታውን ያድለን ዘንድ ለምኝልን ።</span>" },
          { num: "፲፫", text: "አንቺ የተባረክሽ ዕፅ ነሽ የሕይወትና የደኅንነት ዕፅ ነሽ ፤ በገነት ውስጥ ባለው ዕፀ ሕይወት ፈንታ በዚህ ዓለም የሕይወት ዕፅ ሆንሽ ። ፍሬሽም የሕይወት ፍሬ ነው በሚወዱት (በሚያውቁት) በዓለም ሰዎች ዘንድ የሚሸት መልካም መዓዛ ያለው አበባ ካንቺ ታየ ። ይኸውም ከርቤ፣ ሚዓ፣ ሰሊክ የተባሉ ሽቶች በልብሶችሽ ላይ አሉ ብሎ በበገና ነቢዩ ዳዊት ትንቢት የተናገረልሽ ነው። አባትሽ ሰሎሞንም የአፍንጫሽ መዓዛ እንደ ነጭ ዕጣን መዓዛ ነው አለ ፤ እኅቴ ሙሽራዬ ሆይ የታጠርሽ ተክል ነሽ መንገድሽ የታጠረች ተክል የታተመች ጕድጓድ ናት ። ከሽቱ ቅመም ጋራ ሽቱ አለሽ ቆዕ የሚባል ሽቱ ናርዶስ ከሚባል ሽቱ ጋር አለሽ ፤ ናርዶስ የሚባል ሽቱ መጽርይ ከሚባል ሽቱ ጋራ አለሽ ቀጺመታት ቀናንሞስ የተባሉ ሽቶች ከደጋ ሽቶች ጋራ አሉሽ ፤ ከሽቶች ሁሉ የሚበልጡ ከርቤና ዐልው የሚባሉ ሽቶች ከነዚህ ሁሉ ሽቶች ጋር አሉሽ ። የገነት ፈሳሽ ሆይ ከደጋ የሚፈስ የሕይወት ውኃ መገናኛ ነሽ ። <span class='rubric'>ቅድስት ሆይ ልጅሽ ይቅርታውን ያድለን ዘንድ ለምኝልን ።</span>" },
          { num: "፲፬", text: "ሳይተክሏትና ውኃ ሳያጠጧት የለመለመች የአሮን በትር በቤተ መቅደስ ነበረች ለካህናት ዝግጁ ያደረጋት ነበረች ። አንቺም በቅድስናና በንጽሕና ጸንተሽ እንደ እርሷ በቤተ መቅደስ ኖርሽ ፤ ከቤተ መቅደስም በክብር በታላቅ ደስታ ወጣሽ ። በእውነት የሕይወት ፍሬ የሆነ ጌታችንና መድኃኒታችን ኢየሱስ ክርስቶስም ካንቺ ተገኘ ። ቅድስት ሆይ ከመልአኩ እንደ ተረዳሽው ከወንድ ያለመገናኘት ልጅን አገኘሽ ፤ መልአኩ መንፈስ ቅዱስ መጥቶ ያድርብሻል የልዑል ኃይልም ይጸልልብሻል ብሎ ነግሮሽ ነበርና ። <span class='rubric'>ቅድስት ሆይ ልጅሽ ይቅርታውን ያድለን ዘንድ ለምኝልን ።</span>" },
          { num: "፲፭", text: "ጸጋን የተመላሽና የደስታ መገኛ ሆይ በልጅሽ ስም ላመንን ለእኛ ለወንዶችና ለሴቶች አገልጋዮችሽ ትለምኝልን ዘንድ ይገባሻል ። ይልቁንም ዓይኖቻቸው ብዙዎች ከሆኑ ከኪሩቤልና ክንፎቻቸው ስድስት ከሆኑ ከሱራፌል ግርማ የሚበልጥ የመወደድ ግርማ አለሽ ። እነዚያ ፊታቸውን ይሸፍናሉ እግሮቻቸውም የትእምርተ መስቀል አምሳያዎች ናቸው ከልጅሽ መለኮት ከሚወጣው እሳት ይድኑ ዘንድ ፤ አንቺ ግን ለመለኮት ማደሪያ ሆንሽ ። የመለኮት ባሕርይም አላቃጠለሽም የእሳት ነበልባልን ተሸከምሽ ። ሙሴ እንጨትነቷ በእሳት ሳይቃጠል ያያት ዕፀ ጳጦስን መሰልሽ ። ሁለንተናው ፍጹም እሳት የሆነ የኀይላት ጌታ እንደ ዕፀ ጳጦስ አላቃጠለሽም ፤ ለክርስቲያን ወገኖች በእውነት መመኪያ የሆንሽ አንቺ ነሽ ። የአምላክ ልጅ ካንቺ ሰው ስለመሆኑም ባንቺ ከምድር ወደ አርያም የቀረብን ሆንን ። በጸሎትሽ ለሚያምኑ ምሕረትን የምታሰጪ ሆይ ለነፍሳችን ሕይወትን የምትለምኚ ነሽ ፤ ወደ ጌታችንና መድኃኒታችን ኢየሱስ ክርስቶስ መንፈስ ቅዱስን በማመን በቀናች ሃይማኖት ያጸናን ዘንድ ይቅርታውንና ምሕረቱን ይሰጠን ዘንድ በምሕረቱ ብዛት ኃጢአታችንን ያስተሠርይልን ዘንድ ። የሁሉን ጌታ የወለድሽው ሆይ ምስጋና ይገባሻል ፤ ዛሬም ዘወትርም ለዘለዓለምም ምስጋናና ክብር ለአብ ለወልድ ለመንፈስ ቅዱስ ይገባል አሜን ። <span class='rubric'>ልጅሽ ይቅርታውን ያድለን ዘንድ ቅድስት ሆይ ለምኝልን ።</span>" },
          { num: "፲፮", text: "<span class='rubric'>በቅዱስ ኤፍሬምና በኢትዮጵያዊው ቅዱስ ያሬድ ላይ ያደረ አምላክን የወለደች የእመቤታችን ድንግል ማርያም ልመናዋ ክብሯ የልጅዋም ቸርነት ከሕዝበ ክርስቲያኑ ጋራ ለዘለዓለም ይኑር አሜን ።</span>" }
        ]
      },
      yewedeswa: {
        title: "ይዌድስዋ መላእክት",
        sub: "መላእክት ማርያምን ያመሰግኗታል",
        sections: [

            <span>→</span>
          </button>
          <button onclick="switchTab('yewedeswa')" class="p-3.5 rounded-xl bg-stone-100 dark:bg-stone-900 border border-stone-200 dark:border-stone-800 text-stone-800 dark:text-stone-300 font-semibold text-sm flex items-center justify-between active:scale-98">
            <span>ይዌድስዋ መላእክት</span>
            <span>→</span>
          </button>
        </div>
      `;

      container.innerHTML = html;
    }

    function renderAnqetse() {
      const data = PRAYER_DATA.anqetse;
      let html = `
        <div class="border-b border-stone-200 dark:border-stone-800 pb-4 text-center">
          <h1 class="text-2xl font-bold text-stone-900 dark:text-stone-50 mb-1">${data.title}</h1>
          <p class="text-sm text-stone-500 dark:text-stone-400">${data.sub}</p>
        </div>
      `;

      data.sections.forEach(sec => {
        html += `
          <article class="p-4 rounded-2xl bg-white dark:bg-stone-900/60 border border-stone-100 dark:border-stone-800/80 shadow-sm space-y-2">
            <p class="leading-relaxed">
              <span class="verse-num text-lg">${sec.num} ፡</span>
              ${sec.text}
            </p>
          </article>
        `;
      });

      html += `
        <div class="pt-4 text-center">
          <button onclick="switchTab('yewedeswa')" class="w-full sm:w-auto px-6 py-3 rounded-xl bg-amber-800 text-white font-semibold text-sm shadow-sm active:scale-98">
            ወደ ይዌድስዋ መላእክት ቀጥል →
          </button>
        </div>
      `;

      container.innerHTML = html;
    }

    function renderYewedeswa() {
      const data = PRAYER_DATA.yewedeswa;
      let html = `
        <div class="border-b border-stone-200 dark:border-stone-800 pb-4 text-center">
          <h1 class="text-2xl font-bold text-stone-900 dark:text-stone-50 mb-1">${data.title}</h1>
          <p class="text-sm text-stone-500 dark:text-stone-400">${data.sub}</p>
        </div>
      `;

      data.sections.forEach(sec => {
        if (sec.gospel) {
          html += `
            <article class="p-5 rounded-2xl bg-amber-50/50 dark:bg-stone-900/80 border border-amber-200/60 dark:border-amber-900/40 shadow-sm space-y-2">
              <span class="rubric text-sm font-bold block">${sec.title}</span>
              <p class="leading-relaxed">${sec.text}</p>
            </article>
          `;
        } else {
          html += `
            <article class="p-4 rounded-2xl bg-white dark:bg-stone-900/60 border border-stone-100 dark:border-stone-800/80 shadow-sm">
              <p class="leading-relaxed">
                <span class="verse-num text-lg">${sec.num}፤</span>
                ${sec.text}
              </p>
            </article>
          `;
        }
      });

      html += `
        <div class="pt-4 text-center">
          <button onclick="switchTab('intercession')" class="w-full sm:w-auto px-6 py-3 rounded-xl bg-amber-800 text-white font-semibold text-sm shadow-sm active:scale-98">
            ወደ የምልጃ ጸሎት ቀጥል →
          </button>
        </div>
      `;

      container.innerHTML = html;
    }

    function renderIntercession() {
      const data = PRAYER_DATA.intercession;
      container.innerHTML = `
        <div class="border-b border-stone-200 dark:border-stone-800 pb-4 text-center">
          <h1 class="text-2xl font-bold text-stone-900 dark:text-stone-50 mb-1">${data.title}</h1>
          <p class="text-sm text-stone-500 dark:text-stone-400">${data.sub}</p>
        </div>

        <article class="p-5 rounded-2xl bg-white dark:bg-stone-900/60 border border-stone-100 dark:border-stone-800/80 shadow-sm space-y-4">
          <div class="text-amber-800 dark:text-amber-400 font-bold text-center text-lg">✝ ጸሎተ ምልጃ</div>
          <p class="leading-loose text-justify text-base sm:text-lg">
            ${data.body}
          </p>
        </article>

        <div class="pt-4 text-center">
          <button onclick="switchTab('daily')" class="text-xs font-semibold text-stone-500 dark:text-stone-400 underline p-2">
            ወደ ዘወትር ጸሎት ተመለስ
          </button>
        </div>
      `;
    }

    function initDayButtons() {
      dayButtonsContainer.innerHTML = '';
      const order = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
      order.forEach(key => {
        const btn = document.createElement('button');
        btn.id = `day-btn-${key}`;
        btn.textContent = PRAYER_DATA.weekly[key].name;
        btn.className = `px-4 py-1.5 rounded-full text-sm font-semibold transition-all ${
          key === currentDayKey 
            ? 'bg-amber-800 text-white shadow-sm' 
            : 'bg-stone-200/80 dark:bg-stone-800 text-stone-700 dark:text-stone-300'
        }`;
        btn.onclick = () => {
          currentDayKey = key;
          initDayButtons();
          renderWeekly(currentDayKey);
        };
        dayButtonsContainer.appendChild(btn);
      });
    }

    const prayerTabIds = ['tab-daily', 'tab-weekly', 'tab-anqetse', 'tab-yewedeswa', 'tab-intercession'];

    function switchTab(tab) {
      activePrayerTab = tab;

      prayerTabIds.forEach(id => {
        const el = document.getElementById(id);
        if (id === `tab-${tab}`) {
          el.className = "px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold bg-white dark:bg-stone-950 text-stone-900 dark:text-stone-100 shadow-sm border border-stone-200 dark:border-stone-700 transition-all";
        } else {
          el.className = "px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold text-stone-600 dark:text-stone-400 transition-all";
        }
      });

      if (tab === 'weekly') {
        daySelectorBar.classList.remove('hidden');
        initDayButtons();
        renderWeekly(currentDayKey);
      } else {
        daySelectorBar.classList.add('hidden');
        if (tab === 'daily') renderDaily();
        else if (tab === 'anqetse') renderAnqetse();
        else if (tab === 'yewedeswa') renderYewedeswa();
        else if (tab === 'intercession') renderIntercession();
      }

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // --- 5. BIBLE VIEWER & DYNAMIC FETCHER ---
    const bookSelect = document.getElementById('bible-book-select');
    const chapterPills = document.getElementById('bible-chapter-pills');

    function filterBooks(testament) {
      currentTestament = testament;
      const btnOt = document.getElementById('btn-ot');
      const btnNt = document.getElementById('btn-nt');

      if (testament === 'OT') {
        btnOt.className = "py-2 px-4 rounded-lg bg-white dark:bg-stone-950 shadow-sm text-stone-900 dark:text-stone-100 transition-all";
        btnNt.className = "py-2 px-4 rounded-lg text-stone-600 dark:text-stone-400 transition-all";
      } else {
        btnNt.className = "py-2 px-4 rounded-lg bg-white dark:bg-stone-950 shadow-sm text-stone-900 dark:text-stone-100 transition-all";
        btnOt.className = "py-2 px-4 rounded-lg text-stone-600 dark:text-stone-400 transition-all";
      }

      const filtered = BIBLE_BOOKS.filter(b => b.testament === testament);
      bookSelect.innerHTML = filtered.map(b => `<option value="${b.id}">${b.name}</option>`).join('');

      currentBookId = filtered[0].id;
      currentChapter = 1;
      renderChapterPills();
      loadBibleChapter(currentBookId, currentChapter);
    }

    function initBibleView() {
      filterBooks(currentTestament);
    }

    function onBookChange(bookId) {
      currentBookId = bookId;
      currentChapter = 1;
      renderChapterPills();
      loadBibleChapter(currentBookId, currentChapter);
    }

    function renderChapterPills() {
      const book = BIBLE_BOOKS.find(b => b.id === currentBookId);
      if (!book) return;

      let html = '';
      for (let c = 1; c <= book.chapters; c++) {
        const isActive = c === currentChapter;
        html += `
          <button id="pill-ch-${c}" onclick="goToChapter(${c})" class="shrink-0 min-w-[2.4rem] px-3 py-1.5 rounded-xl text-xs font-bold transition-all active:scale-95 ${
            isActive 
              ? 'bg-amber-800 text-white shadow-md ring-2 ring-amber-700/40' 
              : 'bg-stone-200/90 dark:bg-stone-800 text-stone-700 dark:text-stone-300 hover:bg-stone-300 dark:hover:bg-stone-700'
          }">
            ${c}
          </button>
        `;
      }
      chapterPills.innerHTML = html;

      // Auto-scroll active pill into view without clipping
      setTimeout(() => {
        const activeEl = document.getElementById(`pill-ch-${currentChapter}`);
        if (activeEl) {
          activeEl.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }
      }, 50);
    }

    function goToChapter(c) {
      currentChapter = c;
      renderChapterPills();
      loadBibleChapter(currentBookId, currentChapter);
    }

    function loadBibleChapter(bookId, chapterNum) {
      const book = BIBLE_BOOKS.find(b => b.id === bookId);
      const filePath = `${bookId}/${chapterNum}.htm`;

      container.innerHTML = `
        <div class="py-16 text-center text-stone-400">
          <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-amber-800 border-t-transparent mb-3"></div>
          <p class="text-sm">ምዕራፍ ${chapterNum} በመጫን ላይ...</p>
        </div>
      `;

      fetch(filePath)
        .then(response => {
          if (!response.ok) throw new Error("ፋይሉ አልተገኘም");
          return response.arrayBuffer();
        })
        .then(buffer => {
          const decoder = new TextDecoder('utf-8');
          const htmlText = decoder.decode(buffer);
          parseAndDisplayBibleHtml(htmlText, book, chapterNum);
        })
        .catch(err => {
          container.innerHTML = `
            <div class="p-6 rounded-2xl bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-900 text-center space-y-3">
              <p class="text-red-700 dark:text-red-300 font-semibold">ይህንን ምዕራፍ ማግኘት አልተቻለም (${filePath})</p>
              <p class="text-xs text-stone-500">እባክዎ ፋይሎቹ በትክክል ከ index.htm ጋር በአንድ ፎልደር ውስጥ መቀመጣቸውን ያረጋግጡ።</p>
            </div>
          `;
        });
    }

    function parseAndDisplayBibleHtml(htmlText, book, chapterNum) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(htmlText, 'text/html');

      const textBody = doc.querySelector('#textBody');
      let bodyHtml = '';

      if (textBody) {
        const innerH3 = textBody.querySelector('h3');
        if (innerH3) innerH3.remove();

        textBody.querySelectorAll('.verse').forEach(v => {
          const num = v.textContent.trim();
          v.className = 'bible-verse-num';
          v.textContent = num ? `[${num}] ` : '';
        });

        bodyHtml = textBody.innerHTML;
      } else {
        bodyHtml = "<p>ጽሑፉን ማሳየት አልተቻለም።</p>";
      }

      let content = `
        <div class="border-b border-stone-200 dark:border-stone-800 pb-4 text-center">
          <span class="text-xs uppercase tracking-wider font-semibold text-amber-700 dark:text-amber-400">${book.testament === 'OT' ? 'ብሉይ ኪዳን' : 'አዲስ ኪዳን'}</span>
          <h1 class="text-2xl font-bold text-stone-900 dark:text-stone-50 mt-1">${book.name}</h1>
          <p class="text-sm font-semibold text-stone-500 dark:text-stone-400 mt-0.5">ምዕራፍ ${chapterNum}</p>
        </div>

        <article class="p-5 sm:p-6 rounded-2xl bg-white dark:bg-stone-900/60 border border-stone-100 dark:border-stone-800/80 shadow-sm leading-relaxed text-justify">
          ${bodyHtml}
        </article>

        <!-- Chapter Nav Controls -->
        <div class="pt-6 border-t border-stone-200 dark:border-stone-800 flex items-center justify-between gap-3">
          <button onclick="prevChapter()" ${chapterNum <= 1 ? 'disabled class="opacity-30 pointer-events-none py-2 px-4 rounded-xl bg-stone-200 dark:bg-stone-800 text-xs font-bold"' : 'class="py-2.5 px-4 rounded-xl bg-stone-200 dark:bg-stone-800 text-stone-800 dark:text-stone-200 text-xs font-bold active:scale-95 transition-all"'}>
            ← የቀደመው ምዕራፍ
          </button>
          
          <span class="text-xs font-semibold text-stone-500 dark:text-stone-400">ምዕራፍ ${chapterNum} / ${book.chapters}</span>

          <button onclick="nextChapter()" ${chapterNum >= book.chapters ? 'disabled class="opacity-30 pointer-events-none py-2 px-4 rounded-xl bg-stone-200 dark:bg-stone-800 text-xs font-bold"' : 'class="py-2.5 px-4 rounded-xl bg-amber-800 text-white text-xs font-bold active:scale-95 shadow-sm transition-all"'}>
            የሚቀጥለው ምዕራፍ →
          </button>
        </div>
      `;

      container.innerHTML = content;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function prevChapter() {
      if (currentChapter > 1) {
        goToChapter(currentChapter - 1);
      }
    }

    function nextChapter() {
      const book = BIBLE_BOOKS.find(b => b.id === currentBookId);
      if (currentChapter < book.chapters) {
        goToChapter(currentChapter + 1);
      }
    }

    // --- 6. COMMON READING CONTROLS ---
    document.getElementById('font-increase').onclick = () => {
      if (currentFontSize < 34) {
        currentFontSize += 2;
        container.style.fontSize = `${currentFontSize}px`;
      }
    };
    document.getElementById('font-decrease').onclick = () => {
      if (currentFontSize > 14) {
        currentFontSize -= 2;
        container.style.fontSize = `${currentFontSize}px`;
      }
    };

    const themeToggle = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');
    themeToggle.onclick = () => {
      const isDark = document.documentElement.classList.toggle('dark');
      themeIcon.textContent = isDark ? '☀️' : '🌙';
    };

    // Initialize on Daily Prayer
    container.style.fontSize = `${currentFontSize}px`;
    switchTab('daily');
  </script>
</body>
</html>
