          title: "ማክሰኞ የሚጸለይ አምላክን የወለደች የእመቤታችን የድንግል ማርያም ምስጋና፤ ሁለተኛ ክፍል።",
          verses: [
            "፩፤ የመመኪያችን ዘውድ የድኅነታችን መጀመሪያ የንጽሕናችንም መሠረት እኛን ስለማዳን ሰው የሆነ የእግዚአብሔርን ቃል በወለደችልን በድንግል ማርያም ተገኘልን። ሰው ከሆነ በኋላም ፍጹም አምላክ ነው ስለዚህም በድንግልና ወልደችው። ድንቅ የሆነ የመወለድዋ ችሎታ የማይመረመር ሊነገር የማይቻል ነው። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፪፤ በእርሱ ፈቃድ በአባቱ ፈቃድ በመንፈስ ቅዱስም ፈቃድ መጥቶ አዳነን። በድንግልና ፍጽምት የሆንሽ ማርያም ሆይ የድንግልናሽ ምሥጋናና ክብር ታላቅ ነው። እግዚአብሔር ካንቺ ጋር ቢሆን ባለሟልነትን አግኝተሻልና። ያዕቆብ ከምድር እስከ ሰማይ ደርሳ የእግዚአብሔር መላእክት ሲወጡባት ሲወርዱባት ያያት መሰላል አንቺ ነሽ። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፫፤ ሙሴ በነደ እሳት ሳትቃጠል ያያት ዕፅ አንቺ ንሽ ይኸውም መጥቶ በማኅፀንሽ ያደረው የእግዚአብሔር ልጅ ነው የመለኮቱ እሳትነት ሥጋሽን አላቃጠለውም። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፬፤ ዘር ያልተዘራባት እርሻ አንቺ ነሽ የሕይወት ፍሬ ከአንቺ ወጣ። ዮሴፍ የዋጃትና የከበረ ዕንቁን ያገኘባት ሣጥን አንቺ ነሽ ይኸውም መድኃኒታችን ኢየሱስ ክርስቶስ ነው በማኅፀንሽ አደረ በዚህ ዓልምም ወለድሸው። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፭፤ የመላእክት ደስታቸው የሆነ ጌታን የወለድሽ ሆይ ደስ ይበልሽ። የነቢያት ዜናቸው ንጽሕት ሆይ ደስ ይበልሽ እግዚአብሔር ከአንቺ ጋር ቢሆን ባለሟልነትን አግኝተሻልና ደስ ይበልሽ። የዓለም የሰው ሁሉ ደስታ የሆነ የመልአኩን ቃል ተቀብለሻልና ደስ ይበልሽ። ዓለምን ሁሉ የፈጠረ ጌታን የወለድሽ ሆይ ደስ ይበልሽ። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፮፤ በሚገባ የአምላክ እናት ተብለሻልና ደስ ይበልሽ። የሔዋን መድኃኒት ሆይ ደስ ይበልሽ። ፍጥረቱን ሁሉ የሚመግበውን እሱን ጡትሽን አጥብተሽዋልና ደስ ይበልሽ። የሕያዋን የጻድቃን) ሁሉ እናታቸው ቅድስት ሆይ ደስ ይበልሽ። ትለምኝልን ዘንድ ወደ አንቺ እናንጋጥጣለን። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፯፤ ድንግል ሆይ ቅድስት ሆይ ጌታን የወለድሽ ሆይ እኛን ለማዳን ድንቅ ምሥጢር (ተዋህዶ) በአንቺ ቢደረግ ንጉሥን ወልደሽልናልና ፍጥረታትን በልዩ ልዩ መልክ የፈጠረ የርሱን የገናንነቱን ነገር ፈጽመን መናገር አይቻለምና ዝም እንበል። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፰፤ ወደ ደብረሲና የወረደ ለሙሴ ሕግን የሰጠ የተራራውን እራስ በጽጋግ በጢስ በጨለማና በነፋስ የሸፈነ ፈርተው የቆሙትንም በነጋሪቶች ድምፅ የገሠፀ የአብ አካልዊ ቃል ነው። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፱፤ በትሕትና የተናገርሽ ተራራ ሆይ ይኸውም ወደ አንቺ የወረደው ነው። ሰውን የወደደ እርሱ ያለመለወጥ ባንቺ ሰው ሆነ። እንደ እኛ በሚናገር ሥጋ ፍጹም ሆኖ አምላክ በመንፈስ ቅዱስ በማህፀኗ አደረና ፍጹም ሰው ሆነ። አዳምን ያድነው ዘንድ ኃጢአቱንም ያስተሠርይለት ዘንድ በሰማያት (በሰማያዊ መዓርግ) ያኖረው ዘንድ በቸርነቱና በይቅርታው ብዛት ወደ ቀድሞው ቦታው ይመልሰው ዘንድ። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፲፤ የድንግልን ገናንነቷን ሊናገሩት አይቻልም። ጌታ መርጧታልና። የሚቀርበው በሌለ ብርሃን ውስጥ የሚኖር እርሱ መጥቶ አደረባት ዘጠኝ ወር በማኅፀንዋ አደረ የማይታይና የማይመረመር (ታይቶ የማይታወቅ) እርሱን በድንግልና ወለደችው። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፲፩፤ ነቢዩ ዳንኤል ያየው ያለ እጅ ከረጅም ተራራ የተፈነቀለው ያ ደንጊያ ከአብ ዘንድ የወጣው ቃል ነውና መጥቶ ያለ ወንድ ዘር ከድንግል ተወልዶ አዳነን። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፲፪፤ እንደ ንጹሕ ጫፍ ሆንሽ የሃይማኖትም መገኛ ነሽ የቀናች የቅዱሳን አባቶቻችን ሃይማኖታቸው ነሽ። አምላክን የወለድሽና በድንግልና የታተምሽ ንጽሕት ሆይ የአብን ቃል ወለድሽልን ኢየሱስ ክርስቶስ እኛን ለማዳን መጣ። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፲፫፤ የከበርሽ ጌታን የወለድሽ ሆይ የማይታይ ቃልን የተሸከምሸው የብርሃን እናቱ አንቺ ነሽ። እሱን ከወለደሽው በኋላ በድንግልና ኖረሻልና በፍጹም ምስጋና ያገኑሻል፡፡ <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፲፬፤ የአብ ቃል እናቱ ንጽሕት ድንግል ሆይ ስለአንቺ የሚነገረውን ነገር መናገር የሚቻለው ምን አንደበት ነው፤ ኪሩቤል ለሚሸከሙት ንጉሥ ዙፋኑ (ማደሪያው) ሆንሽ፤ የተከበርሽ ሆይ እናመሰግንሻልን የጌታችን የኢየሱስ ክርስቶስ እናቱ መልካሟ እርግብ ሆይ ስምሽን በልጅ ልጅ እንጠራለን። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፲፭፤ እናትና ገረድ ማርያም ሆይ ደስ ይበልሽ። የታቀፍሽውን መላእክት ያመሰግኑታል ኪሩቤልም በፍርሃት ይሰግዱለታልና ሱራፌልም ያለማቋረጥ ክንፋቸውን ዘርግተው የሚመሰገን ንጉሥ (የክብር ባለቤት) ይህ ነው፤ በይቅርታው ብዛት የዓለምን ኃጢአት ያስተሰርይ ዘንድ የመጣው ይህ ነው ይላሉ። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>"
          ]
        },
        wed: {
          name: "ረቡዕ",
          title: "ረቡዕ የሚጸለይ አምላክን የወለደች የእመቤታችን የድንግል ማርያም ምስጋና፤ ሦስተኛ ክፍል።",
          verses: [
            "፩፤ የምድር ሁለተኛ የሆንሽ ሰማይ ሆይ የሰማይ ሠራዊት (መላእክት) ንዕድ ነሽ ይላሉ። ድንግል ማርያም የምስራቅ ደጅ ናት። ሙሽራዋ ንጹሕ የሆነ ንጽሕት የሠርግ ቤት ናት። አብ በሰማይ አይቶ እንዳንቺ አላገኘምና አንድ ልጁን ላከው በአንችም ሰው ሆነ። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፪፤ አምላክን የወለድሽ እመቤታችን ሆይ ትውልድ ሁሉ አንችን ብቻ ያመሰግኑሻል። የእግዚአብሔር ሀገር (ከተማ) ሆይ ነቢያት ድንቅ ድንቅ ነገርን ተናገሩልሽ፤ ደስ የተሰኙ የጻድቃን ማደሪያ ሆነሻልና የምድር ነገሥታት ሁሉ በብርሃንሽ ይሄዳሉ። ሕዝቡም ሠራዊቶቻቸውም በብርሃንሽ ይሄዳሉ፤ ማርያም ሆይ ትውልድ ሁሉ ያመሰግኑሻል። ካንቺ ለተወልደውም ይሰግዱለታል ያገኑታልም። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፬፤ የዝናብ ውሃ የታየብሽ የእውነት ደመና አንቺ ነሽ። አብ የልጁ ምልክት አደረገሽ መንፈስ ቅዱስ አደረብሽ የልዑል ኃይል ጋረደሽ፤ ማርያም ሆይ ለዘለዓለም የሚኖር የአብን ልጅ ቃልን የወለድሽልን መጥቶም ከኃጢአት አዳነን። ደስ የተሰኘህ ሆነህ ምሥራችን የተናገርክ መልአኩ ገብርኤል ሆይ የተሰጠህ ክብር ታላቅ ነው ወደእኛ የመጣ የጌታን ልደት ነገርከን ለድንግል ማርያም ጸጋን የተመላሽ ሆይ እግዚአብሔር ካንቺ ጋር ነውና ደስ ይበልሽ ብለህ አበሰርካት። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፭፤ ጸጋን አገኘሽ መንፈስ ቅዱስ አደረብሽ የልዑል ኃይልም ጋረደሽ (ጸለለብሽ) ማርያም ሆይ በእውነት ቅዱሱን ወለድሽ ዓለምን ሁሉ የሚያድን መጥቶ አዳነን። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፮፤ አንደበታችን የድንግልን ሥራ ያመስግናል። ጌታችንና መድኃኒታችን ኢየሱስ ክርስቶስ በዳዊት አገር ከእርስዋ ስለተወለደ አምላክን የወለደች ማርያምን ዛሬ እናመስግናት አሕዛብ ኑ ማርያምን እናመስግናት። እናትና ድንግል ሁለቱንም ሆናለችና። ርኩሰት የሌለብሽና የአብ ቃለ መጥቶ ካንቺ ሰው የሆነ ንጽሕት ድንግል ሆይ ደስ ይበልሽ፣ ነውር የሌለብሽ ፍጽምትና ጉድፍ የሌለብሽ ሙዳይ ሆይ ደስ ይበልሽ። ስለቀደመ ሰው አዳም ሁሉተኛ አዳም የሆነ የክርስቶስ ማደሪያው የምትናገሪው ገነት ሆይ ደስ ይበልሽ። ከአባቱ ያልተለየ አንድ እሱን የተሸከምሽ ሆይ ደስ ይበልሽ። በክብር ጌጥ ሁሉ ያጌጠ እርሱ መጥቶ ሰው የሆነብሽ ንጽሕት የሠርግ ቤት ሆይ ደስ ይበልሽ። የመለኮት እሳት (ባሕርይ) ያላቃጠለሽ ዕፀ ጳጦስ ሆይ ደስ ይበልሽ። በኪሩቤል ላይ የሚቀመጠውን ሰማያዊ መለኮትን በሥጋ የተሸከምሽ ገረድና እናት ድንግልና ሰማይ ሆይ ደስ ይበልሽ። ስለዚህ ንጹሓን ከሆኑ መላእክት ጋር በፍጹም ደስታ ደስ ተሰኝተን እናመስግን በሰማይም ለእግዚአብሔር ምስጋና ይሁን በምድርም ዕርቅ ይሁን እንበል ክብርና ምስጋና ጌትነት ያለው እርሱ አንችን ወድዋልና። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፯፤ ከቅዱሳን ክብር የማርያም ክብር ይበልጣል፣ የአብን ቃል ለመቀበል በተገባ ተገኝታለችና። መላእክት የሚፈሩትን ትጉሆች በሰማይት የሚያመሰግኑትን ድንግል ማርያም በማኅፀንዋ ተሸከመቸው። ይህች ከኪሩቤል ትበልጣልች፣ ከሱራፌልም ትበልጣልች ከሦስቱ አካል ለአንዱ ማደሪያ ሆናለችና። የነቢያት ሀገራቸው ኢየሩሳሌም ይህች ናት። ለቅዱሳን ሁሉ የደስታቸው ማደሪያ ናት። በጨለማና በሞት ጥላ ውስጥ ለሚኖሩ ሰዎች ታላቅ ብርሃን ወጣላቸው። በቅዱሳን ላይ የሚያድር እግዚአብሔር እኛን ለማዳን ልዩ ከሆነች ድንግል ሰው ሆኗዋልና። ኑ ይህን ድንቅ እዩ። ስለ ተገለጠልን ምስጢር ምስጋና አቅርቡ። ሰው የማይሆን ሰው ሆኗልና። ቃል ተዋህዷልና። ጥንት የሌለው ሥጋ ጥንታዊ ቀዳማዊ ሆነ ዘመን የማይቆጠርለት መለኮት ዘመን ተቆጠረለት። የማይታወቅ ተገለጠ የማይታይ ታየ የሕያው የእግዚአብሔር ልጅ በእርግጥ ሰው ሆነ። ትላንት የነበረው ዛሬም ያለው መቼም የሚኖረው ኢየሱስ ክርስቶስ እንሰግድለት እናመስግነው ዘንድ አንድ ባሕርይ ነው። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፰፤ ነቢዩ ሕዝቅኤል ስለ እርስዋ መሰከረ ድንቅ በሆነ ታላቅ ቁልፍ የተዘጋች ደጅ ምሥራቅ አየሁ አለ ከኃያላን ጌታ በቀር ወደ እርስዋ ገብቶ የወጣ የለም። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፱፤ ኆኅትም ደጅም መድኃኒታችንን የወለደች ድንግል ናት። እርሱን ከወለደች በኋላ እንደ ቀድሞ በድንግልና ኖራለችና። መጥቶ ምሕረት ከሌለው ጠላት እጅ ያዳነን ጌታን የወለጅሽ ሆይ የማኅፅንሽ ፍሬ የተባረከ ነው፥ አንቺ ፍጽምትና የተባረክሽ ነሽ የእውነት አምላክ በሆነ በክብር ባለቤት ዘንድ ባለሟልነትን አግኝተሻልና በምድር ላይ ከሚኖር ሁሉ ይልቅ ገናንነትና ክብር ለአንቺ ይገባል። የአብ ቃል መጥቶ በአንቺ ሰው ሆነ። ከሰው ጋርም ተመላለሰ። መሓሪ ይቅር ባይ ሰውን ወዳጅ ነውና በልዩ አመጣጡ አዳነን። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>"
          ]
        },
        thu: {
          name: "ሐሙስ",
          title: "ሐሙስ የሚጸለይ አምላክን የወለደች የእመቤታችን የድንግል ማርያም ምስጋና፤ አራተኛ ክፍል።",
          verses: [
            "፩፤ ርኵሰት የሌለባት ድንግል ማርያም ሙሴ በበረሃ በነደ እሳት ጫፎቿ ሳይቃጠሉ ያያት ዕፅን ትመስላለች፤ የአብ ቃል በርስዋ ሰው ሆኗልና፣ እሳተ መለኮቱ (የመለኮቱ ባሕርይ) አላቃጠላትምና ከወለደችውም በኋላ ድንግልናዋ አልተለወጠምና ሰውም ቢሆን መለኮቱ አልተለወጠም በዕውነት አምላክ ነውና በዕውነት አምላክ የሆነ እርሱ መጥቶ አዳነን። <span class='rubric'>ቅድስት ሆይ ልምኝልን።</span>",
            "፪፤ አምላክን የወለድሽ እመቤታችን ሆይ ሁላችን እናገንሻልን። ይቅርታሽ ለሁላችን ይሆን ዘንድ ነውና።",
            "፫፤ ሔዋን እንጨት በልታ ባደረገችው ዓመፅ በባሕርያችን ያደረ የቀድሞው እርግማን በእርስዋ የጠፋልን አምላክን የወለደች ድንግል ማርያም የሁላችን መመኪያ ናት። ስለ ሔዋን የገነት ደጅ ተዘጋ ዳግመኛም ስለ ድንግል ማርያም ተከፈተልን። ከዕፀ ሕይወት እንበላ ዘንድ አደለን። ይኸውም እኛን ስለመውደድ መጥቶ ያዳነን የክርስቶስ ክብር ሥጋው ክብር ደሙ ነው። ስለ እርሷ ድንቅ ሆኖ የሚነገረውን ይህን ምሥጢር ማወቅ የሚቻለው ምን ልቡና ነው? መናገር የሚቻለው ምን አንደበት ነው? መስማት የሚቻለው ምን ጆሮ ነው? ሰውን የሚወድ እግዚአብሔር አንድ ብቻ የሆነ አምላክነቱ ሳይለወጥ ከዓለም በፊት የነበረ የአብ ቃል ከአብ ዘንድ መጥቶ ልዩ ከሆነች እናቱ ሰው ሆነ። ከወለደችውም በኋላ ድንግልናዋ አልተለወጠም። ስለዚህ አምላክን የወለደች እንደሆነች ታወቀች። የእግዚአብሔር የጥበቡ ስፋት ምን ይጠልቅ? በጻእር በምጥ በልብ ጋር ትወልድ ዘንድ የፈረደባት ማኅፀን የሕይወት መገኛ ሆነች ከባሕርያችን እርግማንን የሚያጠፋልንን ያለ ወንድ ዘር ወለደችልን። ስለዚህም ሰውን የምትወድ ሆይ ክብር ላንተ ይገባል፤ ቸርና የሰውነታችን መድኃኒትም ነህ እያልን እናመስግነው። <span class='rubric'>ቅድስት ሆይ ልምኝልን።</span>",
            "፬፤ ያለ ወንድ ዘር አምላክን የወለደች ድንግል የማኅፀንዋ ሥራ ምን ይደንቅ? ለዮሴፍ የታየው መልአኩ ከእርሷ በመንፈስ ቅዱስ የሚወለደው ያለ መለወጥ ሰው የሚሆነው የእግዚአብሔር ቃል ነው ብሎ መስክሯልና። ማርያም የዚህ ደስታ ዕፅፍ የሆነ እርሱን ወለደችው። መልአኩ ልጅ ትወልጃለሽ ስሙም አማኑኤል ይባላል አላት። ትርጓሜውም እግዚአብሔር ከእኛ ጋር ሆነ ማለት ነው። ዳግመኛ ወገኖቹን ከኃጢአታቸው የሚያድናቸው ኢየሱስ ይባላል። በችሎታው (በኃይሉ) ያድነን ዘንድ ኃጢአታችንንም ያስተሠርይልን ዘንድ ለዘለዓለም ክብር ይግባውና ሰው የሆነ እርሱን አምላክ እንደሆነ በተረዳ ነገር አውቀነዋልና። ልዩ ከሆነች ድንግል ማርያም ይህ የአምላክ መወለድ ምን ይደንቅ ቃልን ወሰነችው። ልደቱንም ዘር አልቀደመውም። በመወልዱም ንግልናዋን አልለወጠውም። ቃል ከአብ ያለ ድካም ወጣ። ከድንግልም ያለ ሕማም ተወለደ። ሰብአ ስገል ሰገዱለትም አምላክ ነውና ዕጣን አመጡለት ንጉሰም ነውና ወርቅ አመጡለት ስለእኛ በፈቃዱ ለተቀበለው መዳኛችን ለሆነ ሞቱም ከርቤ አመጡለት። ቸር ሰውን ወዳጅ የሆነ አንድ እርሱ ብቻ ነው ። <span class='rubric'>ቅድስት ሆይ ልምኝልን።</span>",
            "፭፤ ከአዳም ጎን አንዲት ዐፅም ማንሣት ምን ይደንቅ? ከእርሱ ሴትን ፈጠረ የሰው ፍጥረትንም ሁሉ ፈጠረ። ጌታ የአብ ቃል ተሰጠ። ከልዩ ድንግልም ሰው ሆነና አማኑኤል ተባለ ስለዚህ ሁል ጊዜ እርስዋን እንለምን፣ ከተወደደ ልጅዋ ታማልደን ዘንድ። በቅዱሳንና በሊቃነ ጳጳሳት ዘንድ ቸር ናት ደጅ የሚጠኑትን ወልዳላቸዋልችና ለነቢትም ትንቢት የተናገሩለትን ወልዳላቸዋለችና ለሐዋርያትም እስከ ዓለም ዳርቻ በስሙ ያስተማሩለትን ወልዳላቸዋለችና ሰማዕታትና ምዕመናንም የተጋደሉለትን የጥበቡ ጸጋ ብዛት የማይታወቅ ኢየሱስ ክርስቶስ ከእርስዋ ተወልዷልና የይቅርታውን ብዛት መርምረን እንወቅ (እንገፈልግ) መጥቶ አድኖናልና። <span class='rubric'>ቅድስት ሆይ ልምኝልን።</span>",
            "፮፤ እግዚአብሔር የባሕርይህን ፍሬ በዙፋንህ አኖራለው ብሎ ለዳዊት በእውነት ማለ እይጸጸትም። ጻድቅ እርሱ ዳዊት ክርስቶስ በሥጋ ከእርሱ እንዲወለድ ባመነ ጊዜ የእግዚአብሔርን ቃል ማደሪያ ፈልጎ ያገኝ ዘንድ ወደደ ይህንንም በታላቅ ትጋት ፈጸመ። ከዚህም በኋላ እነሆ በኤፍራታ ሰማነው ብሎ በመንፈስ ቅዱስ አሰምቶ ተናገረ። ይህቺውም አማኑኤል እኛን ለማዳን በሥጋ ይወልድባት ዘንድ የመረጣት የያዕቆብ አምላክ ማደሪያ ናት። ዳግመኛም ከነቢያት አንዱ ሚክያስ አንቺ የኤፍራታ ክፍል የሆንሽ ቤተልሔም ከይሁዳ ነገሥታት መሳፍንት አገር አታንሺም ወገኖቼ እሥራኤልን የሚጠብቃቸው ንጉሥ ካንቺ ይወጣልና፤ ከዛሬ ጀምሮ እስከ ዘለዓለም ድረስ ከቸር አባቱና ከመንፈስ ቅዱስ ጋር ምስጋና ስለተገባው ስለ ክርስቶስ ባንድ መንፈስ ቅዱስ ትንቢት የተናገሩት የነዚህ የሚክያስና የዳዊት ነገር ምን ይረቅ? <span class='rubric'>ቅድስት ሆይ ልምኝልን።</span>",
            "፯፤ ለእስራኤል የነገሠ ዳዊት ጠላቶቹ በተነሡበት ጊዜ ከቤተልሔም ምንጭ ውኃ ይጠጣ ዘንድ ወደደ የጭፍሮቹ አለቆች ፈጥነው ተነሡና በጠላቶቹ ከተማ ተዋግተው ሊጠጣ የወደደውን አመጡለት። ጻድቅ ዳዊት ግን ጨክነው ሰውነታቸውን ስለ እርሱ ለጦርነት ለሞት አሳልፈው እንደ ሰጡ ባየ ጊዜ ያን ውኃ አፈሰሰ ከእርሱም አልጠጣም ከዚህ በኋላ ለዘለዓለም ጽድቅ ሆኖ ተቆጠረለት። ሰማዕታት የዚችን ዓለም ጣዕም በዕውነት ናቁ ደማቸውንም ስለ እግዚአብሔር አፈሰሱ። ስለ መንግሥተ ሰማያትም መራራ ሞትን ታገሱ። እንደ ይቅርታህ ብዛት ይቅር በለን። <span class='rubric'>ቅድስት ሆይ ልምኝልን።</span>",
            "፰፤ ከቅድስት ሥላሴ አንዱ ወልድ መዋረዳችንን አይቶ ከሰማየ ሰማያት ወርዶ ባሕርዩን ዝቅ አደረገና መጥቶ በድንግል ማኅፀን አደረ። ከብቻዋ ከኃጢአት በቀርም አንደኛ ሰው ሆነ፤ ነቢያት ትንቢት እንደተናገሩለት በቤተልሔም ተወለደ። ፈጽሞ አዳነን ወገኖቹም አደረገን። <span class='rubric'>ቅድስት ሆይ ልምኝልን።</span>"
          ]
        },
        fri: {
          name: "ዐርብ",
          title: "ዓርብ የሚጸለይ አምላክን የወለደች የእመቤታችን የድንግል ማርያም ምስጋና፤ አምስተኛ ክፍል።",
          verses: [
            "፩፤ ከሴቶሽ ተለይተሽ የተባረክሽ ነሽ። የማኅፀንሽም ፍሬ የተባረክ ነው ያለርኵሰት አምላክን የወለድሽ ድንግል ማርያም ሆይ እውነተኛ ፀሐይ ከአንቺ ወጣልን (ጌታ ተወለደልን) በክንፈ ረድኤቱም አቀረበን። እርሱ ፈጥሮናልና። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፪፤ አምላክን የወለድሽ እመቤታችን ሆይ የብርሃን እናት ነሽና አንችን ብቻሽን በክብር በምስጋና እናገንሻለን።",
            "፫፤ የተባረክሽ አንቺ ከመላእክት ትበልጫለሽ ከደቂቀ አዳምም ትበልጫልሽ ከድቂቀ አዳምም ትበልጫለሽ። ከአሳቦች ሁሉ ትበልጫልሽ ገናንነትሽን መናገር የሚቻለው ማነው አንቺን የሚመስል የለምና። ማርያም ሆይ መላእክት ያገኑሻል ሱራፌልም ያመሰግኑሻል። በኪሩቤልና በሱራፌል ላይ አድሮ የሚኖር ጌታ መጥቶ በማኅፀንሽ አድሮአልና። ሰውን የሚወድ ወደ እርሱ አቀረበን፣ ክብር ምስጋና ያለው እርሱ የእኛን ሞት ተቀብሎ የእርሱን ሕይወት ለእኛ ሰጠን። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፬፤ የደናግል መመኪያቸው አምላክን የወለድሽ ድንግል ማርያም ሆይ የተባረክሽ ነሽ የማኅፀንሽም ፍሬ የተባረከ ነው። ከዓለም በፊት የነበረ እርሱ ሰው ሆኖዋልና ከአንቺ ተወልደ ሥጋችንን ነሣ (ተዋሐደ) መንፈስ ቅዱስንም ሰጠን። በቸርነቱ ብዛት መሳዮቹ አደረገን ጸጋንና ክብርን ከተቀበሉ ብዙ ሴቶች አንቺ ትበልጫልሽ አምላክን የወለድሽ ማርያም ሆይ ልዑል እግዚአብሔር ያደረብሽ (የከተመበሽ) ረቂቅ ከተማ ነሽ። በኪሩቤልና በሱራፌል ላይ የሚኖረውን ጌታን በመኻል እጅሽ ይዘሸዋልና። በቸርነቱ ብዛት ሥጋዊ ፍጥረትን ሁሉ የሚመግብ እርሱ ጡትሽን ይዞ ጠባ። ይኸውም ሁሉን የሚያድን አምላካችን ነው። ለዘለዓለሙ ይጠብቀናል። እንሰግድለትን እናመስግነው ዘንድ እርሱ ፈጥሮናና። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፭፤ ድንግል ማርያም የሽቱ መኖሪያና የሕይወት ውኃ ምንጭ ናት። የማኅፀንዋ ፍሬ ሰውን ሁሉ አድኖአልና። ከእኛም እርግማንን አጠፋልን። በመካከለችንም ሆኖ በስቀሉ አስታረቀን በልዩ ትንሣኤውም ሰውን ዳንመኛ ወደ ገነት መለሰው። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፮፤ ንጽሕት ድንግል ማርያም የታመነች አምላክን የወለደች ናትሽ። ለሰዎች ልጆችም የምሕረት አማላጅ ናት። ኃጢአታችንን ያስተሠርይልን ዘንድ ወደ ልጅሽ ወደ ክርስቶስ ለምኝልን። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፯፤ ድንግል ማርያም በቤተመቅደስ አሰምታ ትናገር ነበር። መልአኩ ቅድስት ድንግል ሆይ ሰልምታ ይገባሻል ብሎ አክብሮ ከነገረኝ ነገር በቀር ምንም ምን ሌላ የማውቀው እንደሌለኝ እግዚአብሔር ያውቃል አለች። የማይቻለውን ቻልሽ የማይወሰነውንና ምንም ምን የሚወስነው የሌለውን ወሰንሽ። በክብር ሁሉ ላይ ጸጋን የተመላሽ ሆይ ምስጋናሽ ይበዛል ክብርሽ ፍጹም ነው። የአብ ቃል ማደሪያ ሆነሻልና የክርስቲያን ወገኖች ምእመናንን የምትሰበስቢያቸውና ማሕየዊ የሚያድኑን ለሆኑ ለሥላሴ ሰጊድን (መሰገድን) የምያስተምሪላቸው ሰፊ መጋረጃ ሙሴ ያየውን የእሳት ዓምድ የተሸከምሽ አንቺ ነሽ። ይኸውም መጥቶ በማኅፀንሽ ያደረው የእግዚአብሔር ልጅ ነው። ሰማይና ምድር ለማይወስኑት የታመንሽ አንቺ ነሽ። ከምድር ወደሰማይ ለማረግ መሰላል ሆንሽ ብርሃንሽ ከፀሐይ ብርሃን ይበልጣል። ቅዱሳን በፍጹም ደስታ ያዩት ኮከብ ካንቺ የተወልደ ምሥራቅ አንቺ ነሽ። አንቺ ማርያም ግን ጸጋን የተመላሽ ሆይ ደስ ይበልሽ የሚል ቃልን ሰማሽና መጥቶ ያዳነን የፍጥረት ሁሉ ገዥ የሆነ ንጉሥን ወለድሽልን። መሐሪ ነው፣ ሰውንም ወዳጅ ነው። ስለዚህ ማርያም ሆይ የተባረክሽ ነሽ፣ የማኅፀንሽም ፍሬ የተባረከ ነው። ጸጋን የተመላሽ ሆይ እግዚአብሔር ካንቺ ጋር ነውና ደስ ይበልሽ እያልን መልአኩ ገብርኤል እንዳመሰገነሽ እናመሰግንሻለን። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>"
          ]
        },
        sat: {
          name: "ቅዳሜ",
          title: "ቅዳሜ የሚጸለይ አምላክን የወለደች የእመቤታችን የድንግል ማርያም ምስጋና፤ ስድስተኛ ክፍል።",
          verses: [
            "፩፤ ንጽሕት ነሽ ብርህትም ነሽ። ጌታን በመኻል እጅሽ የያዝሽው ሆይ በሁሉ የተቀደሽ ነሽ። ፍጥረት ሁሉ ቅድስት ሆይ ለምኝልም ብለው እየጮኹ ካንቺ ጋር ደስ ይላቸዋል። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፪፤ ጸጋን የተመላሽ ሆይ ደስ ይበልሽ። ባለሟነትን አግኝተሻልና ደስ ይበልሽ። እግዚአብሔር ካንቺ ጋር ነውና ደስ ይበልሽ።",
            "፫፤ ግርማ ያለሽ ድንግል ሆይ ገናነትሽን እናመሰግናለን እናደንቃለን። እንደ መልአኩ ገብርኤልም ምስጋና እናቀርብልሻለን የባሕርያችን መዳን በማኅፀንሽ ፍሬ ተገኝቷልና። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፬፤ እንደ ሠርግ ቤት ጉድፍ የሌለብሽ ነሽ መንፈስ ቅዱስ አድሮብሻልና። የልዑል ኃይልም ጸልሎሻልና። ማርያም ሆይ ለዘለዓለም የሚኖር መጥቶ ከኃጢአት ያዳነን የአብ ልጅ ቃልን በእውነት ወለድሽ። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፭፤ ከዳዊት ሥር የተገኘሽ ባሕርይ (ዘር) አንቺ ነሽ መድኃኒታችን ኢየሱስ ክርስቶስን በሥጋ ወልደሽልናልና። ከአብ የተወለደ ከዓለም በፊት የነበረ አንዱቃል ራሱን (ባሕርዩን) ሰወረ ካንቺም የተገዥን (ሰውን) አርአያ ነሣ። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፮፤ አምላክን ያለርኵሰት የወለድሽው ሆይ የምድር ሁለተኛ ሰማይን ሆንሽ፣ እውነተኛ ፀሐይ ካንቺ ወጥቶልናልና። እንደነቢያት ትንቢትም ያለዘርና ያለመለወጥ ወደልሽው። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፯፤ ከተለዩ የተለየች የተባልሽ የኪዳን ጽላት ያለብሽ የተሰወረ መና ያለበት የወርቅ መሶብ ያለብሽ ደብተራ ድንኳን አንቺ ነሽ። ይኸውም መና የተባለው መጥቶ በድንግል ማርያም ማኅፀን ያደረው የእግዚአብሔር ልጅ ነው። የአብ ቃል በርስዋ ሰው ሆነ መጥቶ ያዳነን የባሕርይ ንጉሥን በዓለም ውስጥ የወደችው የሚናገር በግ የክርስቶስ እናቱ ገነት ደስ ይላታል ለዘለዓለም የሚኖር የአብ ልጅ እርሱ መጥቶ ከኃጢአት አድኖናልና። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፰፤ የንጉስ ክርስቶስ እናቱን ተባልሽ እርሱን ከወለድሽ በኋላም በድንግልና ኖርሽ። ድንቅ በሆነ ምሥጢርም (ተዋህዶ) አማኑኤልን ወለድሽው ስለዚህም ባለመለወጥ አጸናሽ። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፱፤ እግዚአብሔር በላይዋ ተቀምጦባት ያዕቆብ ያያት መሰላል አንቺ ነሽ በሁሉ በኩል የማይመረመር እርሱን ተፈትሖ በሌለበት ማኅፀንሽ ተሸክመሽዋልና። እኛን ስለማዳን ካንቺ ሰው በሆነ በጌታችን በኢየሱስ ክርስቶስ ዘንድ አማላጅ ሆንሽን። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፲፤ የተባረክሽና ንጽሕት የሆንሽ አዳራሽ ሆይ እነሆ ጌታ የፈጠረውን ዓለም ሁሉ በይቅርታው ብዛት ያድን ዘንድ ካንቺ ወጣ (ተወለደ) ፈጽመን እናመስግነው። ቸርና ሰውን ወዳጅ ነውና። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፲፩፤ ያለርኩሰት ድንግል የሆንሽ ጸጋን የተመላሽ ሆይ ደስ ይበልሽ፤ የዓለም ሁሉ መክበሪያ ንጽሕት ጽዋ ነሽ። የማትጠፊ ፋና ነሽ የማትፈርሽ መቅደስ ነሽ። የቅዱሳን መደገፊያቸው (መጠጊያቸው) የማትለወጪ የሃይማኖት በትር ነሽ፣ ቸር አዳኛችን ወደ ሆነ ልጅሽ ለምኝልን ፈጽሞ ይቅር ይለንና ይምረን ዘንድ ኃጢአታችንንም ያስተሠርይልን ዘንድ። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>"
          ]
        },
        sun: {
          name: "እሁድ",
          title: "በሰንበተ ክርስቲያን እሑድ የሚጸለይ አምላክን የወለደች የእመቤታችን የድንግል ማርያም ምስጋና፤ ሰባተኛ ክፍል።",
          verses: [
            "፩፤ ከሴቶሽ ይልቅ ተለይተሽ የተባረክሽ ሆይ የተወደድሽ ተባልሽ። ከተለዩ የተለየች በውስጧም የኪዳን የሕግ ጽላት ያለባት የምትባይ ሁሉተኛ ክፍል አንቺ ነሽ ኪዳንም በእግዚአብሔር ጣቶሽ የተጻፉ ዓሥሩ ቃላት ናቸው። ያለመለወጥ ካንቺ ሰው የሆነ መድኃኒታችን ኢየሱስ ክርስቶስ ደገኛ ስሙን መጀመሪያ ስሙን አስቀድሞ በየውጣ ነገረን፣ ለአዲስ ኪዳንም አስታራቂ ሆነ። በከበረ ደሙ ፈሳሽነት ወይም መፍሰስ ያመኑትንና ንጹሓን የሆኑትን ወገኖች አነጻቸው። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፪፤ ሁል ጊዜ ንጽሕት የሆንሽ አምላክን የወለድሽ እምቤታችን ሆይ ሁላችን ስለዚህ እናገንሻለን ሰውን በሚወድ በጌታ ዘንድ ይቅርታን እናገኝ ዘንድ እንለምንሻለን ወዳንቺም እናንጋጥጣልን።",
            "፫፤ ከማይነቅዝ እንጨት የተቀረፀ በውስጥና በውጭ በወርቅ የተለበጠ ታቦት ያለመለየትና ያለመለወጥ ሰው የሆነ የእግዚአብሔርን ቃል ይመስልልናል። ይኸውም መለውጥ የሌለበት ንጹሕ መለኮት ነው። ከአብ ጋር የተካከለ ነው ለንጽሕት በራሱ አበሠራት። በልዩ ጥበብ ያለ ወንድ ዘር እንደ እኛ ሆነ መለኮቱን አዋሕዶ ያለ ርኵሰት ባንቺ ሰው ሆነ። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፬፤ በእግዚአብሔር ሥዕል የተሣሉ ኪሩቤል የሚጋርዱሽ መቅደስ አንቺ ነሽ። ንጽሕት ሆይ ያለመለወጥ ካንቺ ሰው የሆነው ቃል ኃጢአታችንን የሚያስተሠርይልንና አበሳችንን የሚደመስስልን ሆነ። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፭፤ የተሠወረ መና ያለብሽ የንጹሕ ወርቅ መሶብ አንቺ ነሽ መናም ከሰማይ የወረደውና ለዓለም ሁሉ ሕይወትን የሚያድለው ኅብስት ነው። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፮፤ ሁል ጊዜ ብርሃንነት ያለውን ፋና የተሸከምሽ የወርቅ መቅረዝ አንቺ ነሽ ይኸውም ፋና የዓለም ብርሃን ነው። ጥንት ከሌለው ብርሃን የተገኘ ብርሃን ነው። ከእውነተኛ አምላክ የተገኘ እውነተኛ አምላክ ነው። ያለ መለወጥ ከአንቺ ሰው የሆነው ነው። በመምጣቱም (ሰው በመሆኑም) በጨለማና በሞት ጥላ ውስጥ ለምንኖር ለእኛ አበራን በልዩ የጥበቡ ምሥጢር በሥጋዌ የልቦናችንን እግር ወደ ሰላም መንገድ አቀናልን። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "፯፤ ቡሩክ ከቤተ መቅደስ ይዞሽ የወጣ እሳትነት ያለውን ፍሕም የተሸከምሽ የወርቅ ማዕጠንት አንቺ ነሽ ፍሕም የተባለውም ኃጢአትን የሚያስተሠርይና በደልን የሚደመስስ ነው። ይኸውም ካንቺ ሰው የሆነና ራሱን የተወደደ መሥዋዕት አድርጎ ያሳረገ የእግዚአብሔር ቃል ነው። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",

    const DAY_KEYS = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
    let activeTab = 'daily';
    let currentFontSize = 18;

    // Auto-detect day of week
    const jsDay = new Date().getDay();
    let currentDayKey = DAY_KEYS[jsDay];

    const container = document.getElementById('prayer-content-container');
    const daySelectorBar = document.getElementById('weekly-selector-bar');
    const dayButtonsContainer = document.getElementById('day-buttons-container');

    function renderDaily() {
      const data = PRAYER_DATA.daily;
      let html = `
        <div class="border-b border-stone-200 dark:border-stone-800 pb-4 text-center">
          <h1 class="text-2xl font-bold text-stone-900 dark:text-stone-50 mb-1">${data.title}</h1>
          <p class="text-sm font-medium text-amber-900/80 dark:text-amber-400/90 mb-2">${data.sub}</p>
          <p class="text-xs text-stone-600 dark:text-stone-400 italic bg-amber-50/70 dark:bg-stone-900 p-2.5 rounded-xl border border-amber-200/50 dark:border-stone-800">${data.intro}</p>
        </div>
      `;

      data.sections.forEach(sec => {
        html += `
          <article class="p-4 rounded-2xl bg-white dark:bg-stone-900/60 border border-stone-100 dark:border-stone-800/80 shadow-sm space-y-3">
            <p class="leading-relaxed">
              <span class="verse-num text-lg">${sec.num}፤</span>
              ${sec.paragraphs.join('</p><p class="leading-relaxed">')}
            </p>
          </article>
        `;
      });

      container.innerHTML = html;
    }

    function renderWeekly(dayKey) {
      const data = PRAYER_DATA.weekly[dayKey];
      let html = `
        <div class="border-b border-stone-200 dark:border-stone-800 pb-4 text-center">
          <span class="text-xs uppercase tracking-wider font-semibold text-amber-700 dark:text-amber-400">የዕለቱ ውዳሴ</span>
          <h1 class="text-2xl font-bold text-stone-900 dark:text-stone-50 mt-1">${data.title}</h1>
        </div>
      `;

      data.verses.forEach(verse => {
        html += `
          <div class="p-4 rounded-2xl bg-white dark:bg-stone-900/60 border border-stone-100 dark:border-stone-800/80 shadow-sm">
            <p class="leading-relaxed">${verse}</p>
          </div>
        `;
      });

      // Quick-jump links at end of daily Wudase
      html += `
        <div class="pt-6 border-t border-stone-200 dark:border-stone-800 grid grid-cols-1 sm:grid-cols-2 gap-3">
          <button onclick="switchTab('yewedeswa')" class="p-3 rounded-xl bg-amber-50 dark:bg-stone-900 border border-amber-200 dark:border-amber-900/50 text-amber-900 dark:text-amber-300 font-semibold text-sm flex items-center justify-between active:scale-98">
            <span>ቀጥሎ፡ ይዌድስዋ መላእክት</span>
            <span>→</span>
          </button>
          <button onclick="switchTab('intercession')" class="p-3 rounded-xl bg-stone-100 dark:bg-stone-900 border border-stone-200 dark:border-stone-800 text-stone-800 dark:text-stone-300 font-semibold text-sm flex items-center justify-between active:scale-98">
            <span>የምልጃ ጸሎት</span>
            <span>→</span>
          </button>
        </div>
      `;

      container.innerHTML = html;
    }

    function renderYewedeswa() {
      const data = PRAYER_DATA.yewedeswa;
      let html = `
        <div class="border-b border-stone-200 dark:border-stone-800 pb-4 text-center">
          <h1 class="text-2xl font-bold text-stone-900 dark:text-stone-50 mb-1">${data.title}</h1>
          <p class="text-sm text-stone-500 dark:text-stone-400">${data.sub}</p>
        </div>
      `;

      data.sections.forEach(sec => {
        if (sec.gospel) {
          html += `
            <article class="p-5 rounded-2xl bg-amber-50/50 dark:bg-stone-900/80 border border-amber-200/60 dark:border-amber-900/40 shadow-sm space-y-2">
              <span class="rubric text-sm font-bold block">${sec.title}</span>
              <p class="leading-relaxed">${sec.text}</p>
            </article>
          `;
        } else {
          html += `
            <article class="p-4 rounded-2xl bg-white dark:bg-stone-900/60 border border-stone-100 dark:border-stone-800/80 shadow-sm">
              <p class="leading-relaxed">
                <span class="verse-num text-lg">${sec.num}፤</span>
                ${sec.text}
              </p>
            </article>
          `;
        }
      });

      html += `
        <div class="pt-4 text-center">
          <button onclick="switchTab('intercession')" class="w-full sm:w-auto px-6 py-3 rounded-xl bg-amber-800 text-white font-semibold text-sm shadow-sm active:scale-98">
            ወደ የምልጃ ጸሎት ቀጥል →
          </button>
        </div>
      `;

      container.innerHTML = html;
    }

    function renderIntercession() {
      const data = PRAYER_DATA.intercession;
      container.innerHTML = `
        <div class="border-b border-stone-200 dark:border-stone-800 pb-4 text-center">
          <h1 class="text-2xl font-bold text-stone-900 dark:text-stone-50 mb-1">${data.title}</h1>
          <p class="text-sm text-stone-500 dark:text-stone-400">${data.sub}</p>
        </div>

        <article class="p-5 rounded-2xl bg-white dark:bg-stone-900/60 border border-stone-100 dark:border-stone-800/80 shadow-sm space-y-4">
          <div class="text-amber-800 dark:text-amber-400 font-bold text-center text-lg">✝ ጸሎተ ምልጃ</div>
          <p class="leading-loose text-justify text-base sm:text-lg">
            ${data.body}
          </p>
        </article>

        <div class="pt-2 text-center">
          <button onclick="switchTab('daily')" class="text-xs font-semibold text-stone-500 dark:text-stone-400 underline p-2">
            ወደ ዘወትር ጸሎት ተመለስ
          </button>
        </div>
      `;
    }

    function initDayButtons() {
      dayButtonsContainer.innerHTML = '';
      const order = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
      order.forEach(key => {
        const btn = document.createElement('button');
        btn.id = `day-btn-${key}`;
        btn.textContent = PRAYER_DATA.weekly[key].name;
        btn.className = `px-4 py-1.5 rounded-full text-sm font-semibold transition-all ${
          key === currentDayKey 
            ? 'bg-amber-800 text-white shadow-sm' 
            : 'bg-stone-200/80 dark:bg-stone-800 text-stone-700 dark:text-stone-300'
        }`;
        btn.onclick = () => {
          currentDayKey = key;
          initDayButtons();
          renderWeekly(currentDayKey);
        };
        dayButtonsContainer.appendChild(btn);
      });
    }

    const tabIds = ['tab-daily', 'tab-weekly', 'tab-yewedeswa', 'tab-intercession'];

    function switchTab(tab) {
      activeTab = tab;

      tabIds.forEach(id => {
        const el = document.getElementById(id);
        if (id === `tab-${tab}`) {
          el.className = "px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold bg-white dark:bg-stone-950 text-stone-900 dark:text-stone-100 shadow-sm transition-all";
        } else {
          el.className = "px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold text-stone-600 dark:text-stone-400 transition-all";
        }
      });

      if (tab === 'weekly') {
        daySelectorBar.classList.remove('hidden');
        initDayButtons();
        renderWeekly(currentDayKey);
      } else {
        daySelectorBar.classList.add('hidden');
        if (tab === 'daily') renderDaily();
        else if (tab === 'yewedeswa') renderYewedeswa();
        else if (tab === 'intercession') renderIntercession();
      }

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Font resizing
    document.getElementById('font-increase').onclick = () => {
      if (currentFontSize < 32) {
        currentFontSize += 2;
        container.style.fontSize = `${currentFontSize}px`;
      }
    };
    document.getElementById('font-decrease').onclick = () => {
      if (currentFontSize > 14) {
        currentFontSize -= 2;
        container.style.fontSize = `${currentFontSize}px`;
      }
    };

    // Dark mode toggle
    const themeToggle = document.getElementById('theme-toggle');
    themeToggle.onclick = () => {
      const isDark = document.documentElement.classList.toggle('dark');
      themeToggle.textContent = isDark ? '☀️' : '🌙';
    };

    // Initialize
    container.style.fontSize = `${currentFontSize}px`;
    switchTab('daily');
  </script>
</body>
</html>
