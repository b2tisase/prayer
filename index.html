          verses: [
            "የመመኪያችን ዘውድ የድኅነታችን መጀምሪያ የንጽሕናችንም መሠረት እኛን ስለማዳን ሰው የሆነ የእግዚአብሔርን ቃል በወለደችልን በድንግል ማርያም ተገኘልን። ሰው ከሆነ በኋላም ፍጹም አምላክ ነው ስለዚህም በድንግልና ወለደችው ድንቅ የሆነ የመውለድዋ ችሎታ የማይመረመር/ሊነገር የማይቻል/ ነው። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "በእርሱ ፈቃድ በአባቱ ፈቃድ በመንፈስ ቅዱስ ፈቃድ መጥቶ አዳነን፡፡ በድንግልና ፍጽምት የሆንሽ ማርያም ሆይ የድንግልናሽ ምስጋናና ክብር ታላቅ ነው። እግዚአብሔር ከአንቺ ጋር ቢሆን ባለሟልነትን አግኝተሻልና። ያዕቆብ ከምድር እስከ ሰማይ ደርሳ የእግዚአብሔር መላእክት ሲወጡባትና ሲወርዱባት ያያት መሰላል አንቺ ነሽ ። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "ሙሴ በነደ እሳት ሳትቃጠል ያያት ዕፅ አንቺ ነሽ። ይኽውም መጥቶ በማሕጸንሽ ያደረው የእግዚአብሔር ልጅ ነው፡፡ የመለኮቱ እሳትነት ሥጋሽን አላቃጠለውም። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "ዘር ያልተዘራባት እርሻ አንቺ ነሽ። የሕይወት ፍሬ ከአንቺ ወጣ ዮሴፍ የዋጃትና የከበረ እንቁን ያገኘባት ሣጥን አንቺ ነሽ። ይኽውም መድኃኒታችን ኢየሱስ ክርስቶስ ነው። በማሕጸንሽ አደረ በዚህ ዓለምም ወለድሽው፡፡ <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "የመላእክት ደስታቸው የሆነ ጌታን የወለድሽ ሆይ ደስ ይበልሽ። የነቢያት ዜናቸው ንጽሕት ሆይ ደስ ይበልሽ። እግዚ አብሔር ከአንቺ ጋር ቢሆን ባለሟልነትን አግኝተሻልና ደስ ይበልሽ። የዓለም(የሰው)ሁሉ ደስታ የሆነ የመልአኩን ቃል ተቀብለሻልና ደስ ይበልሽ። ዓለምን ሁሉ የፈጠረ ጌታን የወለድሽ ሆይ ደስ ይበልሽ። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "በሚገባ የአምላክ እናት ተብለሻልና ደስ ይበልሽ። የሔዋን መድኃኒትዋ ሆይ ደስ ይበልሽ። ፍጥረቱን ሁሉ የሚመግበውን እሱን ጡትሽን አጥብተሽዋልና ደስ ይበልሽ። የሕያዋን (የጻድቃን)ሁሉ እናታቸው ቅድስት ሆይ ደስ ይበልሽ። ትለምኝልን ዘንድ ወደ አንቺ እናንጋጥጣለን። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "ድንግል ሆይ ቅድስት ሆይ ጌታን የወለድሽ host እኛን ለማዳን ድንቅ ምሥጢር/ተዋሕዶ/በአንቺ ቢደረግ ንጉሥን ወልደሽልናልና ፍጥረታትን በልዩ ልዩ መልክ የፈጠረ የእር ሱን የገናንነቱን ነገር ፈጽመን መናገር አይቻለንምና ዝም እንበል። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "ወደ ደብረ ሲና የወረደ ለሙሴ ሕግን የሰጠ የተራራውን ራስ በጽጋግ በጢስ በጨለማና በነፋስ የሸፈነ ፈርተው የቆ ሙትንም በነጋሪቶች ድምጽ የገሰጸ የአብ አካላዊ ቃል ነው። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "በትሕትና የተናገርሽ ተራራ ሆይ ይኸውም ወደ አንቺ የወረደው ነው። ሰውን የወደደ እርሱ ያለመለወጥ በአንቺ ሰው ሆነ እንደ እኛ በሚናገር ሥጋ ፍጹም ሆኖ አምላክ በመንፈስ ቅዱስ በማሕጸንዋ አደረና ፍጹም ሰው ሆነ። አዳምን ያድነው ዘንድ ኃጢአቱንም ያስተሠርይለት ዘንድ በሰማያት(በሰማያዊ መዓርግ)ያኖረው ዘንድ በቸርነቱና በይቅርታው ብዛት ወደ ቀድሞ ቦታው ይመልሰው ዘንድ። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "የድንግል ገናንነቷ ሊናገሩት አይቻልም ጌታ መርጧታልና የሚቀርበው በሌለ ብርሃን ውስጥ የሚኖር እርሱ መጥቶ አደረባት። ዘጠኝ ወር በማኅጸንዋ አደረ። የማይታይና የማይመረመር(ታይቶ የማይታወቅ እርሱን በድንግልና ወለደችው። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "ነቢዩ ዳንኤል ያየው ያለ እጅ ከረጅም ተራራ የተፈነቀለው ያ ደንጊያ ከአብ ዘንድ የወጣው ቃል ነውና። መጥቶ ያለ ወንድ ዘር ከድንግል ተወልዶ አዳነን። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "እንደ ንጹሕ ጫፍ ሆንሽ የሃይማኖትም መገኛ ነሽ የቀናች የቅዱሳን አባቶቻችን ሃይማኖታቸው ነሽ አምላክን የወለድሽና በድንግልና የታተምሽ ንጽሕት ሆይ የአብን ቃል ወለድሽልን ኢየሱስ ክርስቶስ እኛን ለማዳን መጣ። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "የከበርሽ ጌታን የወለድሽ ሆይ የማይታይ ቃልን የተሸከምሽው የብርሃን እናቱ አንቺ ነሽ እሱን ከወለድሽው በኋላ በድንግልና ኖረሻልና በፍጹም ምስጋና ያገኑሻል። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "የአብ ቃል እናቱ ንጽሕት ድንግል ሆይ ስለአንቺ የሚነገረውን ነገር መናገር የሚቻለው ምን አንደበት ነው? ኪሩቤል ለሚሸከሙት ንጉሥ ዙፋኑ/ማደሪያው/ ሆንሽ የተከበርሽ ሆይ እናመሰግንሻለን የጌታችን ኢየሱስ ክርስቶስ እናቱ መልካሟ ርግብ ሆይ ስምሽን በልጅ ልጅ እንጠራለን። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "እናትና ገረድ ማርያም ሆይ ደስ ይበልሽ። የታቀፍሽውን መላእክት ያመሰግኑታልና ኪሩቤልም በፍርሃት ይሰግዱለታልና ሱራፌልም ያለማቋረጥ ክንፋቸውን ዘርግተው የሚመሰገን ንጉሥ/የክብር ባለቤት/ይህ ነው በይቅርታው ብዛት የዓለምን ኃጢአት ያሥተሰርይ ዘንድ የመጣው ይህ ነው ይላሉ። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>"
          ]
        },
        wed: {
          name: "ረቡዕ",
          title: "ረቡዕ የሚጸለይ አምላክን የወለደች የድንግል ማርያም ምስጋና ሦስተኛ ክፍል",
          verses: [
            "የምድር ሁለተኛ የሆንሽ ሰማይ ሆይ የሰማያት ሠራዊት /መላእክት/ ንዕድ ነሽ ይላሉ፤ ድንግል ማርያም የምሥራቅ ደጅ ናት። ሙሽራዋ ንጹሕ የሆነ ንጽሕት የሰርግ ቤት ናት። አብ በሰማይ አይቶ እንዳንቺ ያለ አላገኘምና አንድ ልጁን ላከው በአንቺም ሰው ሆነ። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "አምላክን የወለድሽ እመቤታችን ሆይ ትውልድ ሁሉ አንቺን ብቻ ያመሰግኑሻል። የእግዚአብሔር ሀገር /ከተማ/ ሆይ ነቢያት ድንቅ ድንቅ ነገርን ተናገሩልሽ ደስ የተሰኙ የጻድቃን ማደሪያ ሆነሻልና የምድር ነገስታት ሁሉ በብርሃንሽ ይሔዳሉ ሕዝቡም/ ሠራዊቶቻቸውም በብርሃንሽ ይሔዳሉ ማርያም ሆይ ትውልድ ሁሉ ያመሰግኑሻል ከአንቺ ለተወለደውም ይሰግዱለታል ያገኑታልም። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "የዝናም ውሃ የታየብሽ የእውነት ደመና አንቺ ነሽ ። አብ የልጁ ምልክት አደረገሽ መንፈስ ቅዱስ አደረብሽ የልዑል ኃይል ጋረደሽ ማርያም ሆይ ለዘለዓለም የሚኖር የአብን ልጅ ቃልን የወለድሽልን መጥቶም ከኃጢአት አዳነን። ደስ የተሰኘህ ሆነህ ምሥራችን የተናገርክ መልአኩ ገብርኤል ሆይ የተሰጠህ ክብር ታላቅ ነው ወደ እኛ የመጣ የጌታን ልደት ነገርኽን ለድንግል ማርያም ጸጋን የተመላሽ ሆይ እግዚአብሔር ካንቺ ጋር ነውና ደስ ይበልሽ ብለህ አበሰርካት። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "ጸጋን አገኘሽ መንፈስ ቅዱስ አደረብሽ የልዑል ኃይልም ጋረገሽ /ጸለለብሽ/ ማርያም ሆይ በእውነት ቅዱስን ወለድሽ። ዓለምን ሁሉ የሚያድን መጥቶ አዳነን። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "አንደበታችን የድንግልን ሥራ ያመሰግናል ጌታችንና መድኀኒታችን ኢየሱስ ክርስቶስ በዳዊት አገር ከእርሷ ስለተወለደ አምላክን የወለደች ማርያምን ዛሬ እናመስግናት አሕዛብ ኑ ማርያምን እናመስግናት እናትና ድንግልን ሁለቱንም ሆናለችና ርኩሰት የሌለብሽና የአብ ቃል መጥቶ ከአንቺ ሰው የሆነ ንጽሕት ድንግል ሆይ ደስ ይበልሽ፤ ነውር የሌለብሽ ፍጽም ትና ጉድፍ የሌለብሽ ሙዳይ ሆይ ደስ ይበልሽ፤ ስለቀደመ ሰው አዳም ሁለተኛ አዳም የሆነ የክርስቶስ ማደሪያው የምትናገርው ገነት ሆይ ደስ ይበልሽ፤ ከአባቱ ያልተለየ አንድ እሱን የተሸከምሽ ሆይ ደስ ይበልሽ፤ በክብር ጌጽ ሁሉ እርሱ መጥቶ ሰው የሆነብሽ ንጽሕት የሠርግ ቤት ሆይ ደስ ይበልሽ የመለኮት እሣት /ባሕርይ/ ያላቃጠለሽ ዕፀ ጳጦስ ሆይ ደስ ይበልሽ፤ በኪሩቤል ላይ የሚቀመጠውን ሰማያዊ /መለኮትን/ በስጋ የተሸከምሽ ገረድና እናት ድንግልና ሰማይ ሆይ ደስ ይበልሽ፤ ስለዚህ ንጹሃን ከሆኑ መላእክት ጋራ በፍጹም ደስታ ደስ ተሰኝተን እናመስግን በሰማይም ለእግዚአብሔር ምስጋና ይሁን በምድርም እርቅ ይሁን እንበል ክብርና ምሥጋና / ጌትነት/ ያለው እርሱ አንቺን ወዷልና። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "ከቅዱሳን ክብር የማርያም ክብር ይበልጣል የአብን ቃል ለመቀበል በተገባ ተገኝታለችና መላእክት የሚፈሩትን ትጉሆች በሰማያት የሚያመሰግኑትን ድንግል ማርያም በማሕጸኗ ተሸከመችው። ይህች ከኪሩቤል ትበልጣለች ከሱራፌልም ትበልጣለች። ከሦስቱ አካል ለአንዱ ማደሪያ ሆናለችና የነቢያት ሀገራቸው ኢየሩሳሌም ይህች ናት። ለቅዱሳን ሁሉ የደስታቸው ማደሪያ ናት በጨለማና በሞት ጥላ ውስጥ ለሚኖሩ ሰዎች ታላቅ ብርሃን ወጣላቸው በቅዱሳን ላይ የሚያድር እግዚአብሔር እኛን ለማዳን ልዩ ከሆነች ድንግል ሰው ሆኗልና ኑ ይህን ድንቅ እዩ ስለተገለጠልን ምሥጢር ምስጋና አቅርቡ ሰው የማይሆን ሰው ሆኗልና ቃል ተዋህዷልና ጥንት የሌለው ስጋ ጥንታዊ ቀዳማይ ሆነ ዘመን የማይቆጠርለት /መለኮት/ ዘመን ተቆጠረለት የማይታወቅ ተገለጠ የማይታይ ታየ የሕያው የእግዚአብሔር ልጅ በእርግጥ ሰው ሆነ። ትላንት የነበረው ዛሬም ያለው መቼም የሚኖረው ኢየሱስ ክርስቶስ እንሰግድለትና እናመሰግነው ዘንድ አንድ ባሕርይ ነው። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "ነቢዩ ሕዝቅኤል ስለ እርሷ መሰከረ ድንቅ በሆነ ታላቅ ቁልፍ የተዘጋች ደጅ ከምሥራቅ አየሁ አለ ከኃያላን ጌታ በቀር ወደ እርሷ ገብቶ የወጣ የለም። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "ኆኅትም /ደጅም/ መድኃኒታችንን የወለደች ድንግል ናት። እርሱን ከወለደች በኋላ እንደ ቀድሞው በድንግልና ኖራለችና መጥቶ ምሕረት ከሌለው ጠላት እጅ ያዳነን ጌታን የወለድሽ ሆይ የማኅፀንሽ ፍሬ የተባረከ ነው። አንቺ ፍጽምትና የተባረክሽ ነሽ የእውነት አምላክ በሆነ በክብር ባለቤት ዘንድ ባለሟ ልነትን አግኝተሻልና በምድር ላይ ከሚኖሩ ሁሉ ይልቅ ገናንነትና ክብር ለአንቺ ይገባል የአብ ቃል መጥቶ በአንቺ ሰው ሆነ ከሰው ጋርም ተመላለሰ፤መሓሪ ይቅር ባይ ሰውን ወዳጅ ነውና በልዩ አመጣጡ አዳነን ። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>"
          ]
        },
        thu: {
          name: "ሐሙስ",
          title: "ሐሙስ የሚጸለይ አምላክን የወለደች የእመቤታችን የድንግል ማርያም ምስጋና አራተኛ ክፍል",
          verses: [
            "ርኩሰት የሌለባት ድንግል ማርያም ሙሴ በበረሃ በነደ እሳት ጫፎቿ ሳይቃጠሉ ያያት ዕፅን ትመስላለች የአብ ቃል በርስዋ ሰው ሆኗልና እሳተ መለኮቱ / የመለኮቱ ባህርይ/ አላቃጠላትምና ከወለደችውም በኋላ ድን ግልናዋ አልተለወጠምና ሰውም ቢሆን መለኮቱ አልተ ለወጠም በእውነት አምላክ ነውና በእውነት አምላክ የሆነ መጥቶ አዳነን። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "አምላክን የወለድሽ እመቤታችን ሆይ ሁላችን እናገንሻለን ይቅርታሽ ለሁላችን ይሆን ዘንድ ነውና። ሔዋን እንጨት በልታ ባደረገችው ዓመፅ በባሕርያችን ያደረ የቀድሞው እርግማን በእርስዋ የጠፋልን አምላክን የወለደች ድንግል ማርያም የሁላችን መመኪያ ናት። ስለ ሔዋን የገነት ደጅ ተዘጋ ዳግመኛም ስለ ድንግል ማርያም ተከፈተልን ከዕፀ ሕይወት እንበላ ዘንድ አደለን ይኽውም እኛን ስለመውደድ መጥቶ ያዳነንየክርስቶስ ክቡር ሥጋው ክቡር ደሙነው ሰለ እርሷድንቅ ሆኖ የሚነገረውን ይህን ምስጢር ማወቅ የሚቻለው ምን ልቡና ነው? መናገር የሚቻለው ምን አንደበት ነው? መስማት የሚቻለው ምን ጆሮ ነው? ሰውን የሚወድ እግዚአብሔር አንድ ብቻ የሆነ አምላክነቱ ሳይለወጥ ከዓለም በፊት የነበረ የአብ ቃል ከአብ ዘንድ መጥቶ ልዩ ከሆነች እናቱ ሰው ሆነ ከወለደ ችው በኋላም ድንግልናዋ አልተለወጠም ስለዚህም አምላክን የወለደች እንደሆነች ታወቀች እግዚአብሔር የጥበቡ ስፋት ምን ይጠልቅ? በጻእር በምጥ በልብ ጋር ትወልድ ዘንድ የፈረደባት ማኅፀን የሕይወት መገኛ ሆነች ከባሕርያችን እርግማንን የሚያጠፋልንን ያለ ወንድ ዘር ወለደችልን ስለዚህም ሰውን የምትወድ ሆይ ክብር ላንተ ይገባል ቸርና የሰውነታችንም መድኃኒት ነህ እያልን እናመስግነው። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "ያለ ወንድ ዘር አምላክን የወለደች ድንግል የማኅፀንዋ ሥራ ምን ይደንቅ? ለዮሴፍ የታየው መልአኩ ከእርስዋ በመንፈስ ቅዱስ የሚወለደው ያለ መለወጥ ሰው የሚሆ ነው የእግዚአብሔር ቃል ነው ብሎ መስክሯልና ማርያም የዚህ ደስታ ዕፅፍ የሆነ እርሱን ወለደችው መልአኩ ልጅ ትወልጃለሽ ስሙም አማኑኤል ይባላል አላት። ትርጓሜውም እግዚአብሔር ከእኛ ጋር ሆነ ማለት ነው፡፡ ዳግመኛ ወገኖቹን ከኀጢአታቸው የሚያድናቸው ኢየሱስ ይባላል በችሎታው /በኃይሉ/ ያድነን ዘንድ ኀጢአታችንንም ያስተሠርይልን ዘንድ ለዘላለም ክብር ይግባውና ሰው የሆነ እርሱን አምላክ እንደሆነ በተረዳ ነገር አውቀነዋልና ልዩ ከሆነች ድንግል ማርያም ይህ የአምላክ መወለድ ምን ይደንቅ ቃልን ወሰነችው ልደቱንም ዘር አልቀደመውም በመወለዱም ድንግልናዋን አልለወጠውም ቃል ከአብ ያለ ድካም ወጣ ከድንግልም ያለህማም ተወለደ። ሰብአ ሰገል ሰገዱለት አምላክ ነውና ዕጣን አመጡለት ንጉሥም ነውና ወርቅ አመጡለት ስለኛ በፈቃዱ ለተቀበለው መዳኛችን ለሆነ ሞቱም ከርቤ አመጡለት ቸርና ሰውን ወዳጅ የሆነ አንድ እርሱ ብቻ ነው። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "ከአዳም ጎን አንዲት ዐፅም መንሣት ምን ይደንቅ? ከእርሱ ሴትን ፈጠረ የሰው ፍጥረትንም ሁሉ ፈጠረ። ጌታ የአብ ቃል ተሰጠ ከልዩ ድንግልም ሰው ሆነና አማኑኤል ተባለ ስለዚህ ሁልጊዜ እርስዋን እንለምን ከተወደደ ልጅዋ ታማልደን ዘንድ። በቅዱሳንና በሊቃነ ጳጳሳት ሁሉ ዘንድ ቸር ናት። ደጅ የሚጠኑትን ወልዳላቸዋለችና ፤ ለነቢያትም ትንቢት የተናገሩለትን ወልዳላቸዋለችና፤ ለሐዋርያትም እስከ ዓለም ዳርቻ በስሙያስተማሩለትን ወልዳላቸዋለችና ሰማዕታትና ምዕመናንም የተጋደሉለት የጥበቡ ጸጋ ብዛት የማይታወቅ ኢየሱስ ክርስቶስ ከእርስዋ ተወልዷልና የይቅርታውን ብዛት መርምረን እንወቅ / እንፈልግ/ መጥቶ አድኖናልና። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "እግዚአብሔር የባሕርይህን ፍሬ በዙፋንህ ላይ አኖራለሁ ብሎ ለዳዊት በእውነት ማለ አይጸጸትም። ጻድቅ እርሱ ዳዊት ክርስቶስ በሥጋ ከእርሱ እንዲወለድ ባመነ ጊዜ የእግዚአብሔርን ቃል ማደሪያ ፈልጎ ያገኝ ዘንድ ወደደ ይህንንም በታላቅ ትጋት ፈጸመ ከዚህም በኋላ እነሆ በኤፍራታ ሰማነው ብሎ በመንፈስ ቅዱስ አሰምቶ ተናገረ ። ይህቺውም ዐማኑኤል እኛን ለማዳን በሥጋ ይወለድባት ዘንድ የመረጣት የያዕቆብ አምላክ ማደሪያ ናት። ዳግመኛም ከነቢያት አንዱ ሚክያስ አንቺ የኤፍራታ ክፍል የሆንሽ ቤተልሔም ከይሁዳ ነገሥታት መሳፍንት አገር አታንሺም።ወገኖቹ እስራኤልን የሚጠብቃቸው ንጉሥ ካንች ይወጣልና ከዛሬ ጀምሮ እስከ ዘለዓ ለም ድረስ ከቸር አባቱና ከመንፈስ ቅዱስ ጋር ምስጋና ስለተገባው ስለ ክርስቶስ በአንድ መንፈስ ቅዱስ ትንቢት የተናገሩት የነዚህ የሚክያስና የዳዊት ነገር ምን ይረቅ? <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "ለእስራኤል የነገሠ ዳዊት ጠላቶቹ በተነሱበት ጊዜ ከቤተልሔም ምንጭ ውሃ ይጠጣ ዘንድ ወደደ የጭፍሮቹ አለቆች ፈጥነው ተነሱና በጠላቶቹ ከተማ ተዋግተው ሊጠጣ የወደደውን አመጡለት ጻድቅ ዳዊትግን ጨክነው ሰውነታቸውን ስለ እርሱ ለጦርነት ለሞት አሳልፈው እንደ ሰጡ ባየ ጊዜ ያን ውሃ አፈሰሰ ከእርሱም አልጠጣም። ከዚህ በኋላ ለዘለዓለም ጽድቅ ሆኖ ተቆጠረለት። ሰማዕታት የዚህችን ዓለም ጣዕም በእውነት ናቁ ደማቸውንም ስለእግዚአብሔር አፈሰሱ ስለመንግስተ ሰማያትም መራራ ሞትን ታገሱ እንደ ይቅርታህ ብዛት ይቅር በለን። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "ከቅድስት ሥላሴ አንዱ ወልድ መዋረዳችንን አይቶ፤ ከሰማየ ሰማያት ወርዶ፤ ባሕርይውን ዝቅ አደረገና መጥቶ በድንግል ማኅፀን አደረ። ከብቻዋ ከኃጢአት በቀርም እንደኛ ሰው ሆነ ነቢያት ትንቢት እንደ ተናገሩለት በቤተልሔም ተወለደ። ፈጽሞ አዳነን ወገኖቹም አደረገን። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>"
          ]
        },
        fri: {
          name: "ዐርብ",
          title: "ዐርብ የሚጸለይ አምላክን የወለደች የእመቤታችን የድንግል ማርያም ምስጋና አምስተኛ ክፍል",
          verses: [
            "ከሴቶች ተለይተሽ የተባረክሽ ነሽ የማኅፅንሽም ፍሬ የተባረከ ነው ያለ ርኩሰት አምላክን የወለድሽ ድንግል ማርያም ሆይ እውነተኛ ፀሐይ ከአንቺ ወጣልን /ጌታ ተወለደልን/ በክንፈ ረድኤቱም አቀረበን እርሱ ፈጥሮና ልና። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "አምላክን የወለድሽ እመቤታችን ሆይ የብርሃን እናት ነሽና አንቺን ብቻሽን በክብር በምስጋና እናገንሻለን የተባረክሽ አንቺ ከመላእክት ትበልጫለሽ ከደቂቀ አዳምም ትበልጫለሽ ከአሳቦች ሁሉ ትበልጫለሽ ገናንነትሽን መናገር የሚቻለው ማነው አንቺን የሚመ ስል የለምና ማርያም ሆይ መላእክት ያገኑሻል ሱራፌልም ያመሰግኑሻል በኪሩቤልና በሱራፌል ላይ አድሮ የሚኖር ጌታ መጥቶ በማኅጸንሽ አድርዋልና ሰውን የሚወድ ወደ እርሱ አቀረበን ክብር ምስጋና ያለው እርሱ የእኛን ሞት ተቀብሎ የእርሱን ሕይወት ለእኛ ሰጠን፡፡ <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "የደናግል መመኪያቸው አምላክን የወለድሽ ድንግል ማርያምሆይ የተባረክሽ ነሽ የማኅፀንሽም ፍሬ የተባረከ ነው ከዓለም በፊት የነበረ እርሱ ሰው ሆኖዋልና ከአንቺ የተወለደ ሥጋችንን ነሣ/ተዋሐደ/ መንፈስ ቅዱስንም ሰጠን በቸርነቱ ብዛት መሳዮቹ አደረገን ጸጋንና ክብርን ከተቀበሉ ብዙ ሴቶች አንቺ ትበልጫለሽ አምላክን የወለድሽ ማርያም ሆይ ልዑል እግዚአብሔር ያደረብሽ /የከተመብሸ/ ረቂቅ ከተማ ነሽ በኪሩቤልና በሱራፌል ላይ የሚኖረውን ጌታንበመኻል እጅሽ ይዘሺዋልና በቸርነቱ ብዛት ስጋዊ ፍጥረትን ሁሉ የሚመግብ እርሱ ጡትሽን ይዞ ጠባ። ይኸውም ሁሉን የሚያድን አምላካችን ነው ለዘለዓለሙይጠብቀናል እንሰግድለትና እናመሰግነው ዘንድ እርሱ ፈጥሮናልና። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "ድንግል ማርያም የሽቱ መኖሪያና የሕይወት ውሃ ምንጭ ናት የማኅፀንዋ ፍሬ ሰውን ሁሉ አድንዋልና። ከእኛም እርግማንን አጠፋልን። በመካከላችንም ሆኖ በመስቀሉ አስታረቀን በልዩ ትንሳኤውም ሰውን ዳግ መኛ ወደ ገነት መለሰው። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "ንጽሕት ድንግል ማርያም የታመነች አምላክን የወለደች ናት። ለሰዎች ልጆችም የምሕረት አማላጅ ናት። ኃጢአታችንን ያስተሠርይልን ዘንድ ወደ ልጅሽ ወደ ክርስቶስ ለምኝልን። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "ድንግል ማርያም በቤተ መቅደስ አሰምታ ትናገር ነበር መልአኩ ቅድስት ድንግል ሆይ ሰላምታ ይገባሻል ብሎ አክብሮ ከነገረኝ ነገር በቀር ምንም ምን ሌላ የማውቀው ነገር እንደሌለኝ እግዚአብሔር ያውቃል አለች፡፡ የማይቻለውን ቻልሽ የማይወሰነውንና ምንም ምን የሚወስነው የሌለውን ወሰንሽ። በክብር ሁሉ ላይ ጸጋን የተመላሽ ሆይ ምስጋናሽ ይበዛል ክብርሽ ፍጹም ነው። የአብ ቃል ማደሪያ ሆነሻልና የክርስቲያን ወገኖች ምዕመናንን የምትሰበስቢያቸውና ማሕየዊ የሚያድኑን ለሆኑ ለሥላሴ ሰጊድን/መስገድን/ የምታስተ ምሪላቸው ሰፊ መጋረጃ ሙሴ ያየውን የእሳት አምድ የተሸከምሽ አንቺ ነሽ ይኸውም መጥቶ በማሕፀንሽ ያደረው የእግዚአብሔር ልጅ ነው፡፡ ሰማይንና ምድርን ለፈጠረ ጌታ ማደሪያ ሆንሽ። ዘጠኝ ወር በማሕፀንሽ ተሸከምሽው ሰማይና ምድር ለማይወስኑት የታመንሽ አንቺ ነሽ። ከምድር ወደ ሰማይ ለማረግ መሰላል ሆንሽ። ብርሃንሽ ከፀሐይ ብርሃን ይበልጣል። ቅዱሳን በፍጹም ደስታ ያዩት ኮከብ ከአንቺ የተወለደ ምስራቅ አንቺ ነሽ። ይኸውም በጻዕርና በምጥ ትወልድ ዘንድ በሔዋን የፈረደባት ነው፡፡ አንቺ ማርያም ግን ጸጋን የተመላሽ ሆይ ደስ ይበልሽ የሚል ቃልን ሰማሽና መጥቶ ያዳነን የፍጥረት ሁሉ ገዥ የሆነ ንጉሥን ወለድሽልን መሐሪ ነው ሰውንም ወዳጅ ነው፡፡ ስለዚህ ማርያም ሆይ የተባረክሽ ነሽ የማሕፀንሽም ፍሬ የተባረከ ነው ጸጋን የተመላሽ ሆይ እግዚአብሔር ከአንቺ ጋር ነውና ደስ ይበልሽ እያልን መልአኩ ገብርኤል እንዳመሰገነሽ እናመሰግንሻለን። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>"
          ]
        },
        sat: {
          name: "ቅዳሜ",
          title: "ቅዳሜ የሚጸለይ አምላክን የወለደች የእመቤታችን ድንግል ማርያም ምስጋና ስድስተኛ ክፍል",
          verses: [
            "ንጽሕት ነሽ ብርህትም ነሽ ጌታን በመኻል እጅሽ የያዝሽው ሆይ በሁሉ የተቀደስሽ ነሽ ፍጥረቱ ሁሉ ቅድስት ሆይ ለምኝልን ብለው እየጮሁ ከአንቺ ጋር ደስ ይላቸዋል፡፡ <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "ጸጋን የተመላሽ ሆይ ደስ ይበልሽ ባለሟልነትን አግኝተሻልና ደስ ይበልሽ እግዚአብሔር ከአንቺ ጋር ነውና ደስ ይበልሽ ግርማ የለሽ ድንግል ሆይ ገናንነትሽን እናመሰግናለን እናደንቃለን እንደ መልአኩ ገብርኤልም ምስጋና እናቀርብልሻለን የባሕርያችን መዳን በማሕፀንሽ ተገኝቷልና ወደ አባቱ ወደ እግዚአብሔርም አቀረበን። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "እንደ ሰርግ ቤት ጉድፍ የሌለብሽ ነሽ መንፈስ ቅዱስ አድሮብሻልና የልዑል ኃይልም ጸልሎሻልና ማርያም ሆይ ለዘለዓለም የሚኖር መጥቶ ከኀጢአት ያዳነን የአብ ልጅ ቃልን በእውነት ወለድሽ። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",
            "ከዳዊት ሥር የተገኘሽ ባሕርይ/ዘር/አንቺ ነሽ መድኃኒታችን ኢየሱስ ክርስቶስን በስጋ ወልደሽልናልና ከአብ የተወለደ ከዓለም በፊት የነበረ አንዱ ቃል ራሱን/ባሕርዩን/ ሰውረ ከአንቺም የተገዥን/የሰውን/ አርአያ ነሣ። <span class='rubric'>ቅድስት ሆይ ለምኝልን።</span>",

        tabWeeklyBtn.className = "py-2 rounded-lg transition-all text-center bg-white dark:bg-stone-950 shadow-sm text-stone-900 dark:text-stone-100 font-bold";
        tabDailyBtn.className = "py-2 rounded-lg transition-all text-center text-stone-600 dark:text-stone-400";
        daySelectorBar.classList.remove('hidden');
        initDayButtons();
        renderWeekly(currentDayKey);
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    tabDailyBtn.onclick = () => switchTab('daily');
    tabWeeklyBtn.onclick = () => switchTab('weekly');

    // Font Resizing Logic
    document.getElementById('font-increase').onclick = () => {
      if (currentFontSize < 34) {
        currentFontSize += 2;
        container.style.fontSize = `${currentFontSize}px`;
      }
    };
    document.getElementById('font-decrease').onclick = () => {
      if (currentFontSize > 14) {
        currentFontSize -= 2;
        container.style.fontSize = `${currentFontSize}px`;
      }
    };

    // Dark Mode Toggle
    const themeToggle = document.getElementById('theme-toggle');
    themeToggle.onclick = () => {
      const isDark = document.documentElement.classList.toggle('dark');
      themeToggle.textContent = isDark ? '☀️' : '🌙';
    };

    // Initialize initial font and default to Daily view
    container.style.fontSize = `${currentFontSize}px`;
    switchTab('daily');
  </script>
</body>
</html>
